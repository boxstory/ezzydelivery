{% load static %}
{% load crispy_forms_tags %}

<div class="container" id="core_join_container_driver">
    <div class="row p-4   pt-lg-5 align-items-center rounded-3 border shadow-lg" id="core_join_card_driver">
        <div class="col-12 ">

            <div class="row">
                <div class="col-12 ">
                    <form
                        id="core_join_form_driver"
                        method="POST"
                        name="driver_join"
                        enctype="multipart/form-data"
                    >{% csrf_token %}
                        <div class="row g-3">
                            {{ driverjoinform | crispy }}

                            <button
                                id="core_join_btn_driver_submit"
                                class="w-100 btn btn-lg joinbtn"
                                name="join_as_driver"
                                type="submit"
                                value="submit"
                            ><i class="fas fa-car me-2"></i>JOIN AS DRIVER</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
