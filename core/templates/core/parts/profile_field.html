{% comment %}
Purpose: One label/value cell in the profile detail register
Used by: core/profile.html
Notes:   pass wide=True to span both columns (long values such as the address)
{% endcomment %}
<div class="cprf__field{% if wide %} cprf__field--wide{% endif %}">
    <dt class="cprf__field-label">{{ label }}</dt>
    <dd class="cprf__field-value{% if not value %} cprf__field-value--empty{% endif %}">{{ value|default:"Not set" }}</dd>
</div>
