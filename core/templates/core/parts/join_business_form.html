{% load static %}
{% load crispy_forms_tags %}

<div class="container" id="core_join_container_business">
    <div class="row p-4   pt-lg-5 align-items-center rounded-3 border shadow-lg" id="core_join_card_business">
        <div class="col-12 ">

            <div class="row">
                <div class="col-12 ">
                    <form
                        id="core_join_form_business"
                        method="POST"
                        name="join_business"
                        enctype="multipart/form-data"
                    >{% csrf_token %}
                        <div class="row g-3">
                            {{ form | crispy }}

                            <button
                                id="core_join_btn_business_submit"
                                class="w-100 btn btn-lg joinbtn"
                                name="join_business"
                                type="submit"
                                value="submit"
                            ><i class="fas fa-building me-2"></i>REGISTER BUSINESS</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
