{% extends "base.html" %}
{% load static %}

{% block title %}Verify Code{% endblock %}

{% block extra_css %}
<style>
.verify-container {
    max-width: 450px;
    margin: 4rem auto;
    padding: 2rem;
}

.verify-card {
    background: var(--brand-white);
    border-radius: var(--brand-radius-lg);
    box-shadow: var(--brand-shadow-md);
    padding: 2.5rem;
    border-top: 4px solid var(--brand-primary);
}

.verify-header {
    text-align: center;
    margin-bottom: 2rem;
}

.verify-header i {
    font-size: 3rem;
    color: var(--brand-primary);
    margin-bottom: 1rem;
}

.verify-header h2 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--brand-grey-800);
    margin-bottom: 0.5rem;
}

.verify-header p {
    color: var(--brand-grey-600);
    font-size: 0.9375rem;
}

.phone-display {
    background: var(--brand-grey-50);
    padding: 1rem;
    border-radius: var(--brand-radius-sm);
    text-align: center;
    margin-bottom: 1.5rem;
    border: 2px solid var(--brand-grey-200);
}

.phone-display i {
    color: var(--brand-primary);
    margin-right: 0.5rem;
}

.phone-display strong {
    color: var(--brand-grey-800);
    font-size: 1.125rem;
}

.code-input-group {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
}

.code-input {
    width: 50px;
    height: 60px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    border: 2px solid var(--brand-grey-300);
    border-radius: var(--brand-radius-sm);
    transition: var(--brand-transition);
}

.code-input:focus {
    outline: none;
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 3px rgba(255, 211, 59, 0.2);
}

.form-control-full {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 2px solid var(--brand-grey-300);
    border-radius: var(--brand-radius-sm);
    font-size: 1.125rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.5rem;
    transition: var(--brand-transition);
}

.form-control-full:focus {
    outline: none;
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 3px rgba(255, 211, 59, 0.1);
}

.btn-verify {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
    color: var(--brand-grey-800);
    border: none;
    border-radius: var(--brand-radius-md);
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: var(--brand-transition);
    margin-top: 1rem;
}

.btn-verify:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 211, 59, 0.4);
}

.resend-section {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--brand-grey-200);
}

.resend-section p {
    color: var(--brand-grey-600);
    font-size: 0.9375rem;
    margin-bottom: 0.75rem;
}

.btn-resend {
    background: none;
    border: none;
    color: var(--brand-primary);
    font-weight: 600;
    cursor: pointer;
    transition: var(--brand-transition);
    text-decoration: underline;
}

.btn-resend:hover {
    color: var(--brand-primary-dark);
}

@media (max-width: 576px) {
    .verify-container {
        margin: 2rem 1rem;
        padding: 1rem;
    }

    .verify-card {
        padding: 1.5rem;
    }

    .code-input {
        width: 45px;
        height: 55px;
        font-size: 1.25rem;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="verify-container" id="core_password_reset_verify_container_main">
    <div class="verify-card" id="core_password_reset_verify_card_main">
        <div class="verify-header" id="core_password_reset_verify_header">
            <i class="fa-brands fa-whatsapp"></i>
            <h2>Verify Your Code</h2>
            <p>We've sent a 6-digit code to your WhatsApp</p>
        </div>

        <div class="phone-display">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <strong>{{ phone_number }}</strong>
        </div>

        <form id="core_password_reset_verify_form_main" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="verification_code" style="display: block; text-align: center; color: var(--brand-grey-700); font-weight: 600; margin-bottom: 1rem;">
                    Enter Verification Code
                </label>
                <input
                    type="text"
                    class="form-control-full"
                    id="core_password_reset_verify_input_code"
                    name="verification_code"
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    autofocus
                >
            </div>

            <button id="core_password_reset_verify_btn_submit" type="submit" class="btn-verify">
                <i class="fa-solid fa-check-circle me-2"></i>
                Verify Code
            </button>
        </form>

        <div class="resend-section">
            <p>Didn't receive the code?</p>
            <form method="get" action="{% url 'core:password_reset_request' %}" style="display: inline;">
                <button id="core_password_reset_verify_btn_resend" type="submit" class="btn-resend">
                    <i class="fa-solid fa-rotate-right me-1"></i>
                    Resend Code
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Auto-format code input
document.getElementById('core_password_reset_verify_input_code').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});

// Auto-submit on 6 digits
document.getElementById('core_password_reset_verify_input_code').addEventListener('input', function(e) {
    if (this.value.length === 6) {
        this.form.submit();
    }
});
</script>
{% endblock %}
