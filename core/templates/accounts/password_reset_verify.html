{% extends "base.html" %}
{% load static %}

{% block title %}Verify Code{% endblock %}

{% block extra_css %}
<link href="{% static 'core/css/core.css' %}" rel="stylesheet" type="text/css" />
{% endblock %}

{% block content %}
<div class="verify-container" id="core_password_reset_verify_container_main">
    <div class="verify-card" id="core_password_reset_verify_card_main">
        <div class="verify-header" id="core_password_reset_verify_header">
            <i class="fa-brands fa-whatsapp"></i>
            <h2>Verify Your Code</h2>
            <p>We've sent a 6-digit code to your WhatsApp</p>
        </div>

        <div class="phone-display">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <strong>{{ phone_number }}</strong>
        </div>

        <form id="core_password_reset_verify_form_main" method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="verification_code" style="display: block; text-align: center; color: var(--brand-grey-700); font-weight: 600; margin-bottom: 1rem;">
                    Enter Verification Code
                </label>
                <input
                    type="text"
                    class="form-control-full"
                    id="core_password_reset_verify_input_code"
                    name="verification_code"
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    autofocus
                >
            </div>

            <button id="core_password_reset_verify_btn_submit" type="submit" class="btn-verify">
                <i class="fa-solid fa-check-circle me-2"></i>
                Verify Code
            </button>
        </form>

        <div class="resend-section">
            <p>Didn't receive the code?</p>
            <form method="get" action="{% url 'core:password_reset_request' %}" style="display: inline;">
                <button id="core_password_reset_verify_btn_resend" type="submit" class="btn-resend">
                    <i class="fa-solid fa-rotate-right me-1"></i>
                    Resend Code
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Auto-format code input
document.getElementById('core_password_reset_verify_input_code').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});

// Auto-submit on 6 digits
document.getElementById('core_password_reset_verify_input_code').addEventListener('input', function(e) {
    if (this.value.length === 6) {
        this.form.submit();
    }
});
</script>
{% endblock %}
