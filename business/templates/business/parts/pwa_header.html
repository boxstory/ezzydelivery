{% load static %}
{% load i18n %}
<!-- PWA Mobile Header - Only visible on mobile (< 768px) -->
<header class="pwa-header d-md-none">
  <a href="{% url 'business:business_dashboard' %}" class="pwa-header__logo" aria-label="Go to Dashboard">
    <img src="{% static 'webpages/img/ezzy-logo-long-white.png' %}" alt="Ezzy Delivery" class="pwa-header__logo-img">
  </a>
  <div class="pwa-header__actions">
    {# Revealed by business_dashboard_base.html only when the app is not already installed. #}
    <button type="button" class="pwa-header__btn d-none" id="business_pwa_install_btn" aria-label="Install app"
      title="Install app">
      <i class="fa-solid fa-circle-down" aria-hidden="true"></i>
    </button>
    <button type="button" class="pwa-header__btn" id="pwa-notifications-btn" aria-label="Notifications"
      title="Notifications">
      <i class="fa-solid fa-bell" aria-hidden="true"></i>
    </button>
    {# Opens business/parts/pwa_menu_drawer.html — profile, settings, switch business, logout. #}
    <button type="button" class="pwa-header__btn" id="business_pwa_menu_btn" aria-label="{% trans 'Account menu' %}"
      title="{% trans 'Menu' %}" aria-controls="business_pwa_menu" aria-expanded="false">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
  </div>
</header>
