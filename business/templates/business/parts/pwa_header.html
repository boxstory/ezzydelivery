{% load static %}
<!-- PWA Mobile Header - Only visible on mobile (< 768px) -->
<header class="pwa-header d-md-none">
  <a href="{% url 'business:business_dashboard' %}" class="pwa-header__logo" aria-label="Go to Dashboard">
    <img src="{% static 'webpages/img/ezzy-logo-long-white.png' %}" alt="Ezzy Delivery" class="pwa-header__logo-img">
  </a>
  <div class="pwa-header__actions">
    <button type="button" class="pwa-header__btn" id="pwa-notifications-btn" aria-label="Notifications"
      title="Notifications"
      style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;">
      <i class="fa-solid fa-bell" aria-hidden="true"></i>
    </button>
    {% with biz=business|default:user_business %}
    {% if biz and biz.business_id %}
    <a href="{% url 'business:business_settings' biz.business_id %}" class="pwa-header__btn" aria-label="Settings"
      title="Settings"
      style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </a>
    {% endif %}
    {% endwith %}
  </div>
</header>
