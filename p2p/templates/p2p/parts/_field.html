{% comment %}
Purpose: One labelled form field with its errors, so the booking form stays readable
Used by: p2p/book.html, p2p/delivery_edit.html
{% endcomment %}
<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}
{% if field.help_text %}<div class="p2pb__hint">{{ field.help_text }}</div>{% endif %}
{% for error in field.errors %}<div class="p2pb__error">{{ error }}</div>{% endfor %}
