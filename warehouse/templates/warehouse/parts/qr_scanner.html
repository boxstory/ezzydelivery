<!-- QR Scanner Modal — reusable component -->
<!-- Usage: include this, then call openQrScanner(callback) from JS -->

<div class="qr-scan__overlay" id="qrScanOverlay" style="display:none;">
  <div class="qr-scan__container">
    <div class="qr-scan__header">
      <span class="qr-scan__title"><i class="fas fa-qrcode"></i> Scan QR Code</span>
      <button class="qr-scan__close" onclick="closeQrScanner()"><i class="fas fa-times"></i></button>
    </div>
    <div class="qr-scan__viewfinder">
      <video id="qrVideo" class="qr-scan__video" playsinline></video>
      <div class="qr-scan__frame">
        <div class="qr-scan__corner qr-scan__corner--tl"></div>
        <div class="qr-scan__corner qr-scan__corner--tr"></div>
        <div class="qr-scan__corner qr-scan__corner--bl"></div>
        <div class="qr-scan__corner qr-scan__corner--br"></div>
      </div>
      <div class="qr-scan__laser"></div>
    </div>
    <div class="qr-scan__status" id="qrStatus">Point camera at QR code</div>
    <div class="qr-scan__result" id="qrResult" style="display:none;">
      <i class="fas fa-check-circle"></i> <span id="qrResultText"></span>
    </div>

    <!-- Manual entry fallback -->
    <div class="qr-scan__manual">
      <div class="qr-scan__manual-label">Or enter code manually:</div>
      <div class="d-flex gap-2">
        <input type="text" id="qrManualInput" class="form-control form-control-sm" placeholder="Type code here...">
        <button class="wh__btn wh__btn--primary" onclick="submitManualCode()" style="white-space:nowrap;padding:0.375rem 0.75rem;">
          <i class="fas fa-check"></i> Go
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.qr-scan__overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.85); display: flex;
    align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.qr-scan__container {
    background: var(--wh-navy, #0c1a2e); border-radius: 12px;
    width: 90%; max-width: 360px; overflow: hidden;
}
.qr-scan__header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.75rem 1rem; color: #fff;
}
.qr-scan__title { font-size: 0.875rem; font-weight: 700; }
.qr-scan__title i { color: var(--wh-accent, #f7c000); margin-right: 0.375rem; }
.qr-scan__close {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 1.125rem; cursor: pointer; padding: 0.25rem;
}
.qr-scan__close:hover { color: #fff; }

.qr-scan__viewfinder {
    position: relative; width: 100%; aspect-ratio: 1;
    background: #000; overflow: hidden;
}
.qr-scan__video { width: 100%; height: 100%; object-fit: cover; }
.qr-scan__frame {
    position: absolute; inset: 15%; pointer-events: none;
}
.qr-scan__corner {
    position: absolute; width: 20px; height: 20px;
    border-color: var(--wh-accent, #f7c000); border-style: solid; border-width: 0;
}
.qr-scan__corner--tl { top:0; left:0; border-top-width:3px; border-left-width:3px; }
.qr-scan__corner--tr { top:0; right:0; border-top-width:3px; border-right-width:3px; }
.qr-scan__corner--bl { bottom:0; left:0; border-bottom-width:3px; border-left-width:3px; }
.qr-scan__corner--br { bottom:0; right:0; border-bottom-width:3px; border-right-width:3px; }

.qr-scan__laser {
    position: absolute; left: 15%; right: 15%;
    height: 2px; background: var(--wh-accent, #f7c000);
    box-shadow: 0 0 8px var(--wh-accent, #f7c000);
    animation: qrScanLine 2s ease-in-out infinite;
}
@keyframes qrScanLine {
    0%, 100% { top: 15%; }
    50% { top: 85%; }
}

.qr-scan__status {
    text-align: center; padding: 0.75rem; color: rgba(255,255,255,0.6);
    font-size: 0.75rem; font-weight: 500;
}
.qr-scan__result {
    text-align: center; padding: 0.5rem 1rem; margin: 0 1rem 0.5rem;
    background: #dcfce7; color: #15803d; border-radius: 6px;
    font-size: 0.8125rem; font-weight: 600;
}

.qr-scan__manual {
    padding: 0.75rem 1rem; border-top: 1px solid rgba(255,255,255,0.1);
}
.qr-scan__manual-label {
    font-size: 0.6875rem; color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    margin-bottom: 0.375rem;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<script>
var _qrCallback = null;
var _qrStream = null;
var _qrAnimFrame = null;

function openQrScanner(callback) {
    _qrCallback = callback;
    document.getElementById('qrScanOverlay').style.display = 'flex';
    document.getElementById('qrResult').style.display = 'none';
    document.getElementById('qrStatus').textContent = 'Starting camera...';
    document.getElementById('qrManualInput').value = '';

    var video = document.getElementById('qrVideo');
    navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } }
    })
    .then(function(stream) {
        _qrStream = stream;
        video.srcObject = stream;
        video.play();
        document.getElementById('qrStatus').textContent = 'Point camera at QR code';
        requestAnimationFrame(scanFrame);
    })
    .catch(function(err) {
        document.getElementById('qrStatus').textContent = 'Camera not available — use manual entry';
        console.warn('Camera error:', err);
    });
}

function scanFrame() {
    var video = document.getElementById('qrVideo');
    if (!video || video.paused || video.ended || !_qrStream) return;

    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

    if (code && code.data) {
        onQrDetected(code.data);
        return;
    }

    _qrAnimFrame = requestAnimationFrame(scanFrame);
}

function onQrDetected(data) {
    // Show result
    document.getElementById('qrResult').style.display = 'block';
    document.getElementById('qrResultText').textContent = data;
    document.getElementById('qrStatus').textContent = 'QR code detected!';

    // Vibrate feedback
    if (navigator.vibrate) navigator.vibrate(100);

    // Close after brief delay and call callback
    setTimeout(function() {
        closeQrScanner();
        if (_qrCallback) _qrCallback(data);
    }, 600);
}

function submitManualCode() {
    var input = document.getElementById('qrManualInput');
    var code = input.value.trim();
    if (!code) return;
    closeQrScanner();
    if (_qrCallback) _qrCallback(code);
}

function closeQrScanner() {
    document.getElementById('qrScanOverlay').style.display = 'none';
    if (_qrStream) {
        _qrStream.getTracks().forEach(function(t) { t.stop(); });
        _qrStream = null;
    }
    if (_qrAnimFrame) {
        cancelAnimationFrame(_qrAnimFrame);
        _qrAnimFrame = null;
    }
}
</script>
