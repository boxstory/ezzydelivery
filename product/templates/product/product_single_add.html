{% extends "business_dashboard_base.html" %}
{% load static %}
<!-- extra title -->
{% block extra_head %}
  Products
{% endblock extra_head %}
<!-- extra css -->
{% load crispy_forms_tags %}
{% block content %}
  <section class="container pt-4 col-10" id="product_add_section">
    <div class="row">
      <div class="col-md-12 pb-3 d-flex justify-content-between" id="product_add_header">
        <h2 id="product_add_title">Add Product</h2>
        <a class="text-decoration-none text-light" href="">
          <div class="btn btn-dark my-2" id="product_add_btn_back">Back</div>
        </a>
      </div>
    </div>
    <div class=" container" id="product_add_form_container">
      <div class="col-md-10 container d-flex justify-content-center" id="product_add_form_wrapper">
        <form method="POST" id="product_add_form_main">
          {% csrf_token %}
          {{ form | crispy }}
          <div class="submit my-3 text-center" id="product_add_submit_wrapper">
            <button type="submit" value="submit" class="btn btn-primary-fill" id="product_add_btn_submit">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
{% block extra_js %}
  <!-- extra js -->
  <script>
        $("#id_color").select2();
        $("#id_unit").select2();
        $("#id_product_category").select2();
  </script>
{% endblock extra_js %}
