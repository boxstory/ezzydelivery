<div class="card col-12 col-lg-6 ">
    <div class="m-2">
        <div class="img-avatar">
            <div>
                {% if product.brand_logo %}
                <img src="{{ product.brand_logo.url }}" alt="">
                {% else %}
                <img src="/media/business/product_images/brand_logo_default.jpg" alt="">
                {% endif %}
            </div>
        </div>
        <div class="card-text ">
            <div class="portada" style="background-image: url('{{ product.product_image.url }}')"></div>
            <div class="title-total">
                <div class="title">{{ product.product_category }}</div>
                <h2>{{ product.item_name }}</h2>
                <div class="desc">
                    {{ product.item_discription }}
                    Morgan has collected ants since they were six years old and now has many dozen ants but none
                    in
                    their pants.
                </div>
                <div class="actions">
                    <button>
                        <i class="far fa-heart"></i>
                    </button>
                    <button>
                        <i class="fa-solid fa-cart-plus"></i>
                    </button>
                    <button>
                        <i class="fas fa-user-friends"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
