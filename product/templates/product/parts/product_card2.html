<div class="d-flex justify-content-center text-center col-12 col-lg-6 p-2">
    <div class="col-4 " style="height: 15rem;">
        <div class="portada" style="background-image: url('{{ product.product_image.url }}')">

        </div>
    </div>
    <div class="col-8 border">
        <div class="row  p-0 m-0">
            <div class="col-8">
                <p class="fw-bold  text-start ps-2 pt-2 m-0">{{ product.brand_name }}</p>
                <p class="fw-bold fs-5 text-start ps-2 m-0">{{ product.item_name }}</p>
                <p class="text-start ps-2 m-0">{{ product.product_category }}</p>
                <p class="text-start ps-2 m-0">Qr. {{ product.item_price }}</p>
            </div>
            <div class="col-4 p-0">
                {% if product.brand_logo %}
                <img src="{{ product.brand_logo.url }}" alt="" class="img-thumbnail border-0 p-0 m-0 ">
                {% else %}
                <img src="/media/business/product_images/brand_logo_default.jpg" alt="" class="img-thumbnail border-0 ">
                {% endif %}
            </div>

        </div>
        <div class="row p-0 m-0 ">


            <p class="row p-2 m-0">
                {{ product.item_discription | truncatechars:100 }}

            </p>
            <div class="d-flex justify-content-evenly align-self-center">
                <button>
                    <i class="far fa-heart"></i>
                </button>
                <button>
                    <i class="fa-solid fa-cart-plus"></i>
                </button>
                <button>
                    <i class="fas fa-user-friends"></i>
                </button>
            </div>
        </div>
    </div>
</div>
