<!-- Product Card Component -->
<div class="col-md-4 col-sm-6 mb-4">
    <div class="card h-100 product-card shadow-sm">
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 150px;">
            {% if item.item_image %}
                <img src="{{ item.item_image.url }}" alt="{{ item.item_name }}" class="img-fluid" style="max-height: 140px;">
            {% else %}
                <i class="fas fa-box fa-3x text-muted"></i>
            {% endif %}
        </div>
        <div class="card-body">
            <h6 class="card-title text-truncate" title="{{ item.item_name }}">{{ item.item_name }}</h6>
            <p class="card-text small text-muted mb-1">
                {% if item.product_category %}{{ item.product_category.name }}{% else %}Uncategorized{% endif %}
            </p>
            <p class="card-text">
                <strong class="text-primary">QAR {{ item.item_price|default:"0.00" }}</strong>
            </p>
            <p class="card-text small">
                Stock: <span class="{% if item.item_quantity > 10 %}text-success{% elif item.item_quantity > 0 %}text-warning{% else %}text-danger{% endif %}">
                    {{ item.item_quantity|default:"0" }}
                </span>
            </p>
        </div>
        <div class="card-footer bg-transparent border-0">
            <div class="d-flex justify-content-between">
                <a href="{% url 'product:product_single_update' item.pk %}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <a href="{% url 'product:product_single_delete' item.pk %}" class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-trash"></i>
                </a>
            </div>
        </div>
    </div>
</div>
