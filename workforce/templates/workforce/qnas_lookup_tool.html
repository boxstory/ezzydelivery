{% extends "wf_dashboard_base.html" %}
{% load static %}

{% block title %}QNAS Coordinate Lookup{% endblock %}

{% block extra_css %}
<link href="{% static 'workforce/css/qnas_lookup.css' %}" rel="stylesheet" type="text/css" />
{% endblock %}

{% block content %}
<div class="wf-qnas__wrapper">
    <div class="wf-qnas__card">
        <div class="wf-qnas__header">
            <div class="wf-qnas__icon">
                <i class="fa-solid fa-map-location-dot"></i>
            </div>
            <h1 class="wf-qnas__title">QNAS Coordinate Lookup</h1>
            <p class="wf-qnas__subtitle">Enter Zone, Street, and Building to get precise coordinates from QNAS database</p>
        </div>

        <form id="qnasLookupForm" onsubmit="lookupCoordinates(event)">
            <div class="mb-3">
                <label for="zone" class="form-label">
                    <i class="fa-solid fa-map-pin me-1"></i> Zone Number *
                </label>
                <input type="number" class="form-control" id="zone" name="zone" required placeholder="e.g., 51" min="1">
            </div>

            <div class="mb-3">
                <label for="street" class="form-label">
                    <i class="fa-solid fa-road me-1"></i> Street Number *
                </label>
                <input type="number" class="form-control" id="street" name="street" required placeholder="e.g., 203" min="1">
            </div>

            <div class="mb-3">
                <label for="building" class="form-label">
                    <i class="fa-solid fa-building me-1"></i> Building Number <small class="text-muted">(optional)</small>
                </label>
                <input type="text" class="form-control" id="building" name="building" placeholder="e.g., 26">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-search me-2"></i>Lookup Coordinates
            </button>
        </form>

        <div id="qnasResult"></div>
    </div>
</div>

<script>
async function lookupCoordinates(event) {
    event.preventDefault();

    const zone = document.getElementById('zone').value;
    const street = document.getElementById('street').value;
    const building = document.getElementById('building').value;
    const resultDiv = document.getElementById('qnasResult');

    // Show loading
    resultDiv.innerHTML = `
        <div class="wf-qnas__loading">
            <div class="wf-qnas__spinner"></div>
            <p class="text-muted">Querying QNAS database...</p>
        </div>
    `;

    try {
        const response = await fetch(`/api/qnas/get-buildings/?zone=${zone}&street=${street}`, {
            method: 'GET',
            credentials: 'include'
        });

        if (!response.ok) {
            throw new Error('QNAS API returned error ' + response.status);
        }

        const buildings = await response.json();
        console.log('QNAS Response:', buildings);

        if (!Array.isArray(buildings) || buildings.length === 0) {
            resultDiv.innerHTML = `
                <div class="wf-qnas__error">
                    <strong><i class="fa-solid fa-exclamation-triangle me-2"></i>No Results Found</strong>
                    <p class="mb-0 mt-2">QNAS database has no buildings for Zone ${zone}, Street ${street}</p>
                </div>
            `;
            return;
        }

        // Find matching building or use first
        let selectedBuilding = buildings[0];
        let isExactMatch = false;

        if (building) {
            const match = buildings.find(b => String(b.building_number) === String(building));
            if (match) {
                selectedBuilding = match;
                isExactMatch = true;
            }
        }

        const lat = parseFloat(selectedBuilding.x);
        const lng = parseFloat(selectedBuilding.y);

        if (isNaN(lat) || isNaN(lng)) {
            resultDiv.innerHTML = `
                <div class="wf-qnas__error">
                    <strong><i class="fa-solid fa-exclamation-triangle me-2"></i>Invalid Coordinates</strong>
                    <p class="mb-0 mt-2">Building found but coordinates are missing or invalid</p>
                </div>
            `;
            return;
        }

        // Display result
        resultDiv.innerHTML = `
            <div class="wf-qnas__result">
                <div class="wf-qnas__result-title">
                    <i class="fa-solid fa-check-circle text-success"></i>
                    Coordinates Found
                    ${isExactMatch ? '<span class="badge badge-success">Exact Match</span>' : '<span class="badge badge-warning">Street Level</span>'}
                </div>

                <div class="wf-qnas__result-coords">
                    <i class="fa-solid fa-location-dot me-2"></i>${lat.toFixed(6)}, ${lng.toFixed(6)}
                </div>

                <div class="wf-qnas__result-info">
                    <div class="wf-qnas__result-item">
                        <span class="wf-qnas__result-label">Zone</span>
                        <span class="wf-qnas__result-value">${zone}</span>
                    </div>
                    <div class="wf-qnas__result-item">
                        <span class="wf-qnas__result-label">Street</span>
                        <span class="wf-qnas__result-value">${street}</span>
                    </div>
                    <div class="wf-qnas__result-item">
                        <span class="wf-qnas__result-label">Building</span>
                        <span class="wf-qnas__result-value">${selectedBuilding.building_number || '—'}</span>
                    </div>
                    <div class="wf-qnas__result-item">
                        <span class="wf-qnas__result-label">Buildings Found</span>
                        <span class="wf-qnas__result-value">${buildings.length}</span>
                    </div>
                </div>

                <div class="mt-3 d-grid gap-2">
                    <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="btn btn-outline-primary">
                        <i class="fa-solid fa-map-location-dot me-2"></i>View on Google Maps
                    </a>
                    <button type="button" class="btn btn-outline-secondary" onclick="copyCoordinates(${lat}, ${lng})">
                        <i class="fa-solid fa-copy me-2"></i>Copy Coordinates
                    </button>
                </div>
            </div>
        `;

    } catch (error) {
        console.error('QNAS Lookup Error:', error);
        resultDiv.innerHTML = `
            <div class="wf-qnas__error">
                <strong><i class="fa-solid fa-exclamation-triangle me-2"></i>Lookup Failed</strong>
                <p class="mb-0 mt-2">${error.message}</p>
            </div>
        `;
    }
}

function copyCoordinates(lat, lng) {
    const coords = lat.toFixed(6) + ', ' + lng.toFixed(6);
    navigator.clipboard.writeText(coords).then(() => {
        alert('Coordinates copied to clipboard: ' + coords);
    }).catch(err => {
        console.error('Failed to copy:', err);
    });
}
</script>
{% endblock %}
