{# Shared Page Hero — include with title, icon, subtitle, note args #}
<div class="wfd__hero">
    <div class="wfd__hero-content">
        <h1 class="wfd__hero-title">
            <i class="fa-solid {{ icon|default:'fa-file' }}"></i>{{ title }}
        </h1>
        {% if subtitle %}<p class="wfd__hero-subtitle">{{ subtitle }}</p>{% endif %}
        {% if note %}<p class="wfd__hero-note"><i class="fa-solid fa-circle-info"></i>{{ note }}</p>{% endif %}
    </div>
</div>
