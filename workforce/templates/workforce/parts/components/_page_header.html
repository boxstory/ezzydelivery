<!-- Page Header Component
Usage: {% include "workforce/parts/components/_page_header.html" with title="Page Title" icon="fa-icon" subtitle="Optional subtitle" count=count_var count_label="items" %}
-->
<header class="page-header">
    <div class="page-header-left">
        <h2><i class="fa-solid {{ icon|default:'fa-file' }} me-1"></i>{{ title }}</h2>
        {% if subtitle %}<span class="page-header-subtitle">| {{ subtitle }}</span>{% endif %}
    </div>
    {% if count is not None or actions %}
    <div class="page-header-right">
        {% if actions %}{{ actions }}{% endif %}
        {% if count is not None %}
        <div class="page-header-count">
            <span class="count-value">{{ count|default:"0" }}</span>
            <span class="count-label">{{ count_label|default:"items" }}</span>
        </div>
        {% endif %}
    </div>
    {% endif %}
</header>
