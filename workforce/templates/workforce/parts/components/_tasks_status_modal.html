{% comment %}
Tasks Status Update Modal Component
Usage: {% include "workforce/parts/components/_tasks_status_modal.html" %}

Requires setStatusModalTask() and submitStatusUpdate() from workforce.js
{% endcomment %}

<div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border:none; border-radius:8px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);">
            <!-- Header -->
            <div class="modal-header" style="background: linear-gradient(135deg, #1e293b, #0f172a); color:#cbd5e1; border-radius:8px 8px 0 0; padding:0.75rem 1rem;">
                <h6 class="modal-title mb-0" id="statusModalLabel">
                    <i class="fa-solid fa-pen-to-square me-2"></i>Update Task Status
                </h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" style="font-size:0.6rem;"></button>
            </div>

            <div class="modal-body" style="padding:1rem;">
                <input type="hidden" id="statusModalTaskId">
                <input type="hidden" id="statusModalStatusType" value="task">

                <!-- Task Info Row -->
                <div class="d-flex align-items-center gap-3 mb-3 p-2" style="background:#f8fafc; border-radius:6px; border:1px solid #e2e8f0;">
                    <div>
                        <div style="font-size:0.6rem; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Task</div>
                        <div style="font-weight:700; font-size:0.8rem; color:#1e293b;" id="statusModalTaskNumber"></div>
                    </div>
                    <div style="width:1px; height:28px; background:#e2e8f0;"></div>
                    <div>
                        <div style="font-size:0.6rem; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Customer</div>
                        <div style="font-weight:600; font-size:0.75rem; color:#334155;" id="statusModalCustomer">—</div>
                    </div>
                    <div class="ms-auto">
                        <div style="font-size:0.6rem; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Current</div>
                        <span class="dl-badge" id="statusModalCurrentBadge" style="font-size:0.6rem;">—</span>
                    </div>
                </div>

                <!-- Status Select -->
                <div class="mb-3">
                    <label for="statusSelect" class="form-label" style="font-size:0.7rem; font-weight:600; color:#475569;">
                        <i class="fa-solid fa-circle-dot me-1"></i>New Status
                    </label>
                    <select class="form-select form-select-sm" id="statusSelect" style="font-size:0.75rem;">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <!-- Driver Assignment -->
                <div class="mb-3">
                    <label for="statusModalDriver" class="form-label" style="font-size:0.7rem; font-weight:600; color:#475569;">
                        <i class="fa-solid fa-user-tie me-1"></i>Assign Driver
                    </label>
                    <select class="form-select form-select-sm" id="statusModalDriver" style="font-size:0.75rem;">
                        <option value="">-- No Driver --</option>
                    </select>
                    <div id="statusModalDriverInfo" style="display:none; font-size:0.65rem; color:#16a34a; margin-top:4px;">
                        <i class="fa-solid fa-circle-check me-1"></i>Currently assigned: <strong id="statusModalDriverName"></strong>
                    </div>
                </div>

                <!-- Time -->
                <div class="mb-3">
                    <label for="statusModalTime" class="form-label" style="font-size:0.7rem; font-weight:600; color:#475569;">
                        <i class="fa-solid fa-clock me-1"></i>Time
                    </label>
                    <input type="datetime-local" class="form-control form-control-sm" id="statusModalTime" style="font-size:0.75rem;">
                </div>

                <!-- Notes -->
                <div class="mb-0">
                    <label for="statusModalNotes" class="form-label" style="font-size:0.7rem; font-weight:600; color:#475569;">
                        <i class="fa-solid fa-sticky-note me-1"></i>Notes
                    </label>
                    <textarea class="form-control form-control-sm" id="statusModalNotes" rows="2" placeholder="Add notes about this status change..." style="font-size:0.75rem; resize:none;"></textarea>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer" style="padding:0.6rem 1rem; border-top:1px solid #e2e8f0;">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" style="font-size:0.7rem;">
                    Cancel
                </button>
                <button type="button" class="btn btn-sm btn-primary" id="statusModalSubmitBtn" onclick="submitStatusUpdate()" style="font-size:0.7rem; min-width:120px;">
                    <i class="fa-solid fa-check me-1"></i>Update Status
                </button>
            </div>
        </div>
    </div>
</div>
