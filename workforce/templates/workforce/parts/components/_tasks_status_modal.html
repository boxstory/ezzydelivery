{% comment %}
Tasks Status Update Modal Component
Usage: {% include "workforce/parts/components/_tasks_status_modal.html" %}

This modal is used for updating task status.
Requires setStatusModalTask() and submitStatusUpdate() functions to be defined.
{% endcomment %}

<div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="statusModalLabel">
                    <i class="fa-solid fa-sync me-2"></i>Update Task Status
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-3">Task: <strong id="statusModalTaskNumber"></strong></p>
                <input type="hidden" id="statusModalTaskId">
                <div class="mb-3">
                    <label for="statusSelect" class="form-label">Select New Status</label>
                    <select class="form-select" id="statusSelect">
                        <option value="">-- Select Status --</option>
                        <option value="pending">Pending</option>
                        <option value="out_for_delivery">Out for Delivery</option>
                        <option value="in_transit">In Transit</option>
                        <option value="delivered">Delivered</option>
                        <option value="rejected">Rejected</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitStatusUpdate()">
                    <i class="fa-solid fa-check me-1"></i>Update Status
                </button>
            </div>
        </div>
    </div>
</div>
