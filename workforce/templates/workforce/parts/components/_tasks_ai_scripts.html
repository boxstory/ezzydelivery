{% comment %}
AI Tools Scripts for Delivery Tasks
Usage: {% include "workforce/parts/components/_tasks_ai_scripts.html" %}

Requires:
- aim__actions-toolbar in _tasks_table_view.html
- Task rows with data-task-id, data-order-number, data-customer-phone, data-customer-address
{% endcomment %}

<script>
(function() {
    'use strict';

    // Get selected tasks with their data attributes
    function getSelectedTasks() {
        var checkboxes = document.querySelectorAll('.task-checkbox:checked');
        return Array.from(checkboxes).map(function(cb) {
            var row = cb.closest('.dl-table__row');
            return {
                id: row.dataset.taskId,
                orderNumber: row.dataset.orderNumber || row.dataset.clientOrderCode || '',
                customerPhone: row.dataset.customerPhone || '',
                customerAddress: row.dataset.customerAddress || ''
            };
        });
    }

    // Parse Addresses
    window.aiParseTaskAddresses = function() {
        var tasks = getSelectedTasks();
        if (tasks.length === 0) { alert('Please select at least one task'); return; }

        if (typeof EzzyAIParse !== 'undefined' && EzzyAIParse.parseBulk) {
            var orders = tasks.map(function(t) {
                return { id: t.id, orderNumber: t.orderNumber, address: t.customerAddress || '' };
            });
            EzzyAIParse.parseBulk(orders);
        } else {
            alert('Address parsing module not available');
        }
    };

})();
</script>
