{% comment %}
Tasks View Toggle Component
Usage: {% include "workforce/parts/components/_tasks_view_toggle.html" %}

This component provides list/grid/table view toggle buttons.
Default view is table (active).
Requires JavaScript from _tasks_view_scripts.html to function.
{% endcomment %}

<div class="btn-group view-toggle" role="group" aria-label="View toggle">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="listViewBtn" onclick="setTasksView('list')" title="List View">
        <i class="fa-solid fa-list"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="gridViewBtn" onclick="setTasksView('grid')" title="Grid View">
        <i class="fa-solid fa-th-large"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm active" id="tableViewBtn" onclick="setTasksView('table')" title="Table View">
        <i class="fa-solid fa-table"></i>
    </button>
</div>
