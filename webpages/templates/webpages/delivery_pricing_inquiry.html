{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}
Delivery Pricing Inquiry
{% endblock title %}

{% block content %}
<div class="container d-flex col-12 justify-content-center ">
    <div class="p-3 col-12 col-md-10 col-lg-8 ">
        <h1 class="text-center p-3 fw-bold bg-light">Delivery Pricing Inquiry Form</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" method="POST" class="btn btn-dark w-100" data-form-type="action">SUBMIT</button>
        </form>
    </div>
</div>
</div>
{% endblock content %}
