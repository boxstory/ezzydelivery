{% load static %}

<!-- Related Pages / Internal Linking Section for SEO -->
{% if related_pages %}
<section class="py-5 bg-light mt-5">
  <div class="container py-5">
    <div class="row">
      <div class="col-12 mb-4">
        <h2 class="h3 fw-bold mb-2">Related Services</h2>
        <p class="text-muted">Explore more delivery solutions for your business</p>
      </div>
    </div>

    <div class="row g-4">
      {% for page in related_pages %}
      <div class="col-12 col-md-6 col-lg-4">
        <a href="{{ page.url }}" class="text-decoration-none h-100">
          <div class="card border-0 shadow-sm h-100 transition-all hover-shadow">
            <div class="card-body">
              <h3 class="card-title h5 fw-bold text-dark mb-2">{{ page.title }}</h3>
              <p class="card-text text-muted small mb-3">{{ page.description }}</p>
              <span class="text-primary fw-semibold small">
                Learn more <i class="fa-solid fa-arrow-right ms-2"></i>
              </span>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
