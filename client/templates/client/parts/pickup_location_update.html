{% extends "dashboard_base.html" %} {% load static %}
<!-- extra css -->
{% load crispy_forms_tags %} {% block content %}
<div class="col-12  " id="client_location_update_container_main">
  <div class="col p-2" id="client_location_update_section_header">
    <h2 class="m-0 text-center pb-3" id="client_location_update_title_form">STORE LOCATION UPDATE</h2>
  </div>
  <div class="d-flex col-12 justify-content-center">
    <form method="POST" class="col-8" id="client_location_update_form_main">
      {% csrf_token %} {{ form | crispy }}

      <button
        type="submit"
        methode="POST"
        class="btn btn-dark w-100 w-md-50"
        href="{% url 'business:pickup_location_update'  id %}"
        id="client_location_update_btn_submit"
      >
        Submit
      </button>
    </form>

    {% endblock content %}
  </div>
</div>
