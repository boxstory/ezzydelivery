{% load static %}
{% block content %}

                <form>
                  <fieldset disabled>
                    <div class="card-body ps-3">
                      <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">Tested Time </label>
                        <input type="text"
                               id="disabledTextInput"
                               class="form-control"
                               placeholder="{{ update_time }}">
                      </div>
                      <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">API Provider</label>
                        <input type="text"
                               id="disabledTextInput"
                               class="form-control"
                               placeholder="{{ api.api_type }}">
                      </div>
                      <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">Status</label>
                        <input type="text"
                               id="disabledTextInput"
                               class="form-control"
                               placeholder="{{ status }}">
                      </div>
                      <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">Count Orders</label>
                        <input type="text"
                               id="disabledTextInput"
                               class="form-control"
                               placeholder="{{ order_count }}">
                      </div>
                      
                      <div class="mb-3">
                        <label for="disabledTextInput" class="form-label">Count Products</label>
                        <input type="text"
                               id="disabledTextInput"
                               class="form-control"
                               placeholder="{{ product_count }}">
                      </div>
                      <div class="mb-3">
                        <p>
                          <strong>Status:</strong>
                          {% if status == 200 %}
                            <i class="fa-solid fa-circle-check mx-3" style="color: #14cc0e;"></i><span class="fw-bold fs-5" style="color: #14cc0e;">Success</span>
                          {% elif status == 404 %}
                            <i class="fa-solid fa-circle-check mx-3" style="color: #03707e;"></i><span class="fw-bolder fs-5" style="color: #0265a7;">Data Error</span>
                          {% else %}
                          <i class="fa-solid fa-circle-check mx-3" style="color: #ec1010;"></i><span class="fw-bold fs-5" style="color: #ec1010;">Update Info</span>
                       
                          {% endif %}
                        </p>
                      </div>
                    </div>
                  </fieldset> 
                </form> 
{% endblock content %}
