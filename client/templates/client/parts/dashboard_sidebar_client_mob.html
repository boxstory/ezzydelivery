{% load static %}
<link href="{% static 'css/sidebar-common.css' %}" rel="stylesheet" type="text/css" />

<!-- Mobile Sidebar Toggle Button - appears after header -->
<div class="d-block d-md-none col-12 mobile-sidebar-toggle" id="client_sidebar_mob_container_toggle">
  <div class="container-fluid p-3">
    <button class="toggle-btn w-100 d-flex justify-content-between align-items-center border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav2"
            aria-controls="navbarNav2"
            aria-expanded="false"
            aria-label="Toggle navigation"
            id="client_sidebar_mob_btn_toggle">
      <span class="fw-bold">
        <i class="fa-solid fa-bars me-2"></i>
        Dashboard Menu
      </span>
      <i class="fa-solid fa-chevron-down chevron"></i>
    </button>
  </div>
</div>

<!-- Mobile Sidebar Content -->
<nav class="d-block d-md-none col-12 mobile-sidebar-nav" id="client_sidebar_mob_nav_main">
  <div class="collapse navbar-collapse" id="navbarNav2">
    <a class="mobile-sidebar-header" href="{% url 'business:business_dashboard' %}" id="client_sidebar_mob_link_dashboard">
      <i class="fa-solid fa-gauge-high me-2"></i>
      Clients Dashboard
    </a>

    <hr />

    <ul class="navbar-nav">
      <li class="nav-item {% if request.resolver_match.url_name == 'orders_all_list' or request.resolver_match.url_name == 'orders_list' or request.resolver_match.url_name == 'orders_pending_list' or request.resolver_match.url_name == 'orders_successfull_list' or request.resolver_match.url_name == 'get_orders_by_base_api' or request.resolver_match.url_name == 'add_order' %}active{% endif %}">
        <div class="nav-link btn collapsed d-flex justify-content-start align-items-center {% if request.resolver_match.url_name == 'orders_all_list' or request.resolver_match.url_name == 'orders_list' or request.resolver_match.url_name == 'orders_pending_list' or request.resolver_match.url_name == 'orders_successfull_list' or request.resolver_match.url_name == 'get_orders_by_base_api' or request.resolver_match.url_name == 'add_order' %}active{% endif %}"
             data-bs-toggle="collapse"
             data-bs-target="#submenu-orders-mobile"
             aria-expanded="false">
          <i class="fa-solid fa-basket-shopping me-2"></i>
          <span class="flex-fill text-start">Orders</span>
          <i class="fa-solid fa-caret-down ms-auto"></i>
        </div>
        <div class="multi-level collapse"
             id="submenu-orders-mobile"
             aria-expanded="false">
          <a class="nav-link {% if request.resolver_match.url_name == 'orders_all_list' or request.resolver_match.url_name == 'orders_list' %}active{% endif %}" href="{% url 'orders:orders_all_list' %}">
            <i class="fa-solid fa-bars me-2"></i>
            <span>All Orders</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'add_order' %}active{% endif %}" href="{% url 'orders:add_order' %}">
            <i class="fa-solid fa-add me-2"></i>
            <span>Add Orders</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'orders_successfull_list' %}active{% endif %}" href="{% url 'orders:orders_successfull_list' %}">
            <i class="fa-solid fa-check me-2"></i>
            <span>Successful</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'orders_pending_list' %}active{% endif %}" href="{% url 'orders:orders_pending_list' %}">
            <i class="fa-solid fa-spinner me-2"></i>
            <span>Pending</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'get_orders_by_base_api' %}active{% endif %}" href="{% url 'orders:get_orders_by_base_api' %}">
            <i class="fa-solid fa-code me-2"></i>
            <span>API Orders</span>
          </a>
        </div>
      </li>

      <hr />

      <li class="nav-item {% if request.resolver_match.url_name == 'product_all_list' or request.resolver_match.url_name == 'product_single_add' or request.resolver_match.url_name == 'product_categories' or request.resolver_match.url_name == 'product_all_list_card' %}active{% endif %}">
        <div class="nav-link btn collapsed d-flex justify-content-start align-items-center {% if request.resolver_match.url_name == 'product_all_list' or request.resolver_match.url_name == 'product_single_add' or request.resolver_match.url_name == 'product_categories' or request.resolver_match.url_name == 'product_all_list_card' %}active{% endif %}"
             data-bs-toggle="collapse"
             data-bs-target="#submenu-product-mobile"
             aria-expanded="false">
          <i class="fa-solid fa-box-open me-2"></i>
          <span class="flex-fill text-start">Products</span>
          <i class="fa-solid fa-caret-down ms-auto"></i>
        </div>
        <div class="multi-level collapse"
             id="submenu-product-mobile"
             aria-expanded="false">
          <a class="nav-link {% if request.resolver_match.url_name == 'product_all_list' %}active{% endif %}" href="{% url 'product:product_all_list' %}">
            <i class="fa-solid fa-bars me-2"></i>
            <span>All Products</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'product_single_add' %}active{% endif %}" href="{% url 'product:product_single_add' %}">
            <i class="fa-solid fa-add me-2"></i>
            <span>Add Product</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'product_all_list_card' %}active{% endif %}" href="{% url 'product:product_all_list_card' %}">
            <i class="fa-solid fa-barcode me-2"></i>
            <span>Cards</span>
          </a>
        </div>
      </li>

      <hr />

      <li class="nav-item {% if request.resolver_match.url_name == 'product_inventory' %}active{% endif %}">
        <a class="nav-link btn d-flex align-items-center {% if request.resolver_match.url_name == 'product_inventory' %}active{% endif %}" href="{% url 'product:product_inventory' %}">
          <i class="fa-solid fa-chart-bar me-2"></i>
          <span>Inventory Report</span>
        </a>
      </li>

      <li class="nav-item {% if request.resolver_match.url_name == 'driver_directory' %}active{% endif %}">
        <a class="nav-link btn d-flex align-items-center {% if request.resolver_match.url_name == 'driver_directory' %}active{% endif %}" href="{% url 'business:driver_directory' %}">
          <i class="fa-solid fa-address-book me-2"></i>
          <span>Fleet List</span>
        </a>
      </li>

      <li class="nav-item {% if request.resolver_match.url_name == 'business_profile' %}active{% endif %}">
        <a class="nav-link btn d-flex align-items-center {% if request.resolver_match.url_name == 'business_profile' %}active{% endif %}" href="{% url 'business:business_profile' %}">
          <i class="fa-solid fa-store me-2"></i>
          <span>Public View</span>
        </a>
      </li>

      <hr />

      <li class="nav-item {% if request.resolver_match.url_name == 'business_settings' or request.resolver_match.url_name == 'business_teams' or request.resolver_match.url_name == 'pickup_location_list' or request.resolver_match.url_name == 'business_settings_api_list' %}active{% endif %}">
        <div class="nav-link btn collapsed d-flex justify-content-start align-items-center {% if request.resolver_match.url_name == 'business_settings' or request.resolver_match.url_name == 'business_teams' or request.resolver_match.url_name == 'pickup_location_list' or request.resolver_match.url_name == 'business_settings_api_list' %}active{% endif %}"
             data-bs-toggle="collapse"
             data-bs-target="#submenu-settings-mobile"
             aria-expanded="false">
          <i class="fa-solid fa-gear me-2"></i>
          <span class="flex-fill text-start">Settings</span>
          <i class="fa-solid fa-caret-down ms-auto"></i>
        </div>
        <div class="multi-level collapse"
             id="submenu-settings-mobile"
             aria-expanded="false">
          <a class="nav-link {% if request.resolver_match.url_name == 'business_settings' %}active{% endif %}"
             href="{% url 'business:business_settings' request.user.user_business.first.business_id %}">
            <i class="fa-solid fa-sliders me-2"></i>
            <span>Review</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'business_teams' %}active{% endif %}"
             href="{% url 'business:business_teams' request.user.user_business.first.business_id %}">
            <i class="fa-solid fa-users me-2"></i>
            <span>Teams</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'pickup_location_list' %}active{% endif %}"
             href="{% url 'business:pickup_location_list' %}">
            <i class="fa-solid fa-location-dot me-2"></i>
            <span>Stores List</span>
          </a>
          <a class="nav-link {% if request.resolver_match.url_name == 'business_settings_api_list' %}active{% endif %}"
             href="{% url 'business:business_settings_api_list' request.user.user_business.first.business_id %}">
            <i class="fa-solid fa-code me-2"></i>
            <span>API Settings</span>
          </a>
        </div>
      </li>

      <hr />

      <li class="nav-item {% if request.resolver_match.url_name == 'help_center' %}active{% endif %}">
        <a class="nav-link btn d-flex align-items-center {% if request.resolver_match.url_name == 'help_center' %}active{% endif %}" href="{% url 'webpages:help_center' %}" target="_blank">
          <i class="fa-solid fa-circle-question me-2"></i>
          <span>Help Center</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
