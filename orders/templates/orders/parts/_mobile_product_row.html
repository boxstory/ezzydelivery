{% load static %}
<div class="oap__inline-row oap__inline-row--mobile" data-row-index="{{ row_index }}">
  <div class="oap__inline-row-header">
    <span class="oap__inline-row-num">Product #{{ row_index|add:1 }}</span>
    <button type="button" class="oap__inline-remove mobile-product-remove" title="Remove"><i class="fas fa-times"></i></button>
  </div>
  <select name="inline_product_id[]" class="pwa-form-group__input mobile-product-sel mb-2">
    <option value="">Search products…</option>
  </select>
  <div class="d-flex gap-1 align-items-end flex-nowrap mb-1">
    <div class="flex-fill" style="min-width:0;">
      <label class="form-label form-label-sm mb-1">Qty</label>
      <input type="number" name="inline_quantity[]" class="form-control form-control-sm mobile-product-qty" value="1" min="1">
    </div>
    <div class="flex-fill" style="min-width:0;">
      <label class="form-label form-label-sm mb-1">Price <span class="text-muted fw-normal">(QAR)</span></label>
      <input type="number" name="inline_unit_price[]" class="form-control form-control-sm mobile-product-price" step="0.01" min="0" placeholder="Auto">
    </div>
    <div style="width:72px; flex-shrink:0;">
      <label class="form-label form-label-sm mb-1">Total</label>
      <div class="oap__inline-line-total mobile-product-line-total">0.00</div>
    </div>
  </div>
  <input type="hidden" name="inline_notes[]" value="">
</div>
