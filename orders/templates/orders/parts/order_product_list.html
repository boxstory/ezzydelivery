<table class="table m-0">
    <thead class="table-light">
        <tr>
            <th colspan="2">Name</th>
            <th>Qty</th>
            <th class="text-center">Action</th>
        </tr>
    </thead>
    <tbody>
        {% if listed_product %}
        {% for product_list in listed_product %}
        {% if product_list %}
        {% for product in product_list %}
        <tr>
            <td colspan="2">{{ product.name }}</td>
            <td>{{ product.qty }}</td>
            <td class="text-center">
                <a class="btn pe-1 text-dark text-decoration-none" href="{% url 'orders:add_order_product' order.id %}">
                    <i class="fa fa-lg fa-edit me-2"></i>
                </a>
            </td>
        </tr>
        {% endfor %}
        {% endif %}
        {% endfor %}
        {% else %}
        <tr>
            <td class="text-start" colspan="2">No products added</td>
            <td>--</td>
            <td class="text-center">
                <a class="btn pe-1 text-dark text-decoration-none" href="{% url 'orders:add_order_product' order.id %}">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </td>
        </tr>
        {% endif %}
    </tbody>
</table>
