<table class="product-table" id="orders_product_list_table_products">
    <thead id="orders_product_list_thead">
        <tr>
            <th>Product</th>
            <th class="text-center">Qty</th>
            <th class="text-center">Action</th>
        </tr>
    </thead>
    <tbody id="orders_product_list_tbody">
        {% if listed_product %}
        {% for product_list in listed_product %}
        {% if product_list %}
        {% for product in product_list %}
        <tr>
            <td>{{ product.name }}</td>
            <td class="text-center">{{ product.qty }}</td>
            <td class="text-center">
                <a href="{% url 'orders:add_order_product' order.id %}" title="Edit Product">
                    <i class="fa fa-edit" style="color: var(--brand-primary);"></i>
                </a>
            </td>
        </tr>
        {% endfor %}
        {% endif %}
        {% endfor %}
        {% else %}
        <tr>
            <td>No products added</td>
            <td class="text-center">--</td>
            <td class="text-center">
                <a href="{% url 'orders:add_order_product' order.id %}" title="Add Product">
                    <i class="fa-solid fa-plus" style="color: var(--brand-primary);"></i>
                </a>
            </td>
        </tr>
        {% endif %}
    </tbody>
</table>
