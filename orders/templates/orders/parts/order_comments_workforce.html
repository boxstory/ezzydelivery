{% if comments %}
    {% for comment in comments %}
        <div class="comment-item mb-2 p-2 bg-white rounded border-start border-primary border-3">
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-primary fw-bold">
                    <i class="fa-solid fa-user-circle me-1"></i>{{ comment.name }}
                </small>
                <small class="text-muted">{{ comment.created_at|timesince }} ago</small>
            </div>
            <p class="mb-0 small mt-1">{{ comment.body }}</p>
        </div>
    {% endfor %}
{% else %}
    <div class="text-center py-3">
        <i class="fa-regular fa-comment-dots fa-2x text-muted mb-2"></i>
        <p class="text-muted small mb-0">No comments yet</p>
    </div>
{% endif %}
