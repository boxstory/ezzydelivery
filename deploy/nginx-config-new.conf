upstream ezzy_app_server {
    server unix:/run/gunicorn/ezzy.sock fail_timeout=0;
}

# Redirect HTTP to HTTPS (all hosts)
server {
    listen 80;
    listen [::]:80;
    server_name ezzydelivery.qa www.ezzydelivery.qa;
    return 301 https://ezzydelivery.qa$request_uri;
}

# Redirect www HTTPS to non-www HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.ezzydelivery.qa;

    ssl_certificate /etc/letsencrypt/live/ezzydelivery.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezzydelivery.qa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ezzydelivery.qa$request_uri;
}

# Main server block (non-www only)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ezzydelivery.qa;

    ssl_certificate /etc/letsencrypt/live/ezzydelivery.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezzydelivery.qa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ezzyadmin/ezdlproject;
    client_max_body_size 4G;
    keepalive_timeout 5;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /media {
        alias /home/ezzyadmin/ezdlproject/ezzydelivery/media;
    }

    location /static {
        alias /home/ezzyadmin/ezdlproject/ezzydelivery/staticroot;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://ezzy_app_server;
    }
}
