# =====================================================================
# WAHA WhatsApp Bridge — nginx snippet
# =====================================================================
# This is a *snippet*, not a complete config. Copy these blocks into the
# main `server { ... }` block in /etc/nginx/sites-enabled/ezzydelivery
# (the active server block on port 443 for ezzydelivery.qa) — they share
# the same upstream `ezzy_app_server` already defined in nginx-ezzydelivery.conf.
#
# Order matters: the two `^~ /waha/wa-{dashboard,chats}/` blocks MUST
# come before the catch-all `location /waha/` so longest-prefix matching
# routes ops UIs to Django and everything else to the WAHA container.
#
# Before reloading nginx:
#   1. Replace `<WAHA_API_KEY>` below with the actual key from .env
#      (or use a `set $waha_key "..."` directive at the top of the
#      server block and inject `proxy_set_header X-Api-Key $waha_key`).
#   2. Generate /etc/nginx/.htpasswd with htpasswd -c (one-time).
#   3. Make sure WAHA is listening on 127.0.0.1:3000.
#   4. `sudo nginx -t && sudo systemctl reload nginx`
# =====================================================================

# Django ops UIs — htpasswd-gated. Specific prefix wins via ^~.
location ^~ /waha/wa-dashboard/ {
    auth_basic            "EzzyDelivery ops";
    auth_basic_user_file  /etc/nginx/.htpasswd;

    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  Host              $host;
    proxy_redirect    off;
    proxy_buffering   off;
    proxy_pass        http://ezzy_app_server;
}

location ^~ /waha/wa-chats/ {
    auth_basic            "EzzyDelivery ops";
    auth_basic_user_file  /etc/nginx/.htpasswd;

    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  Host              $host;
    proxy_redirect    off;
    proxy_buffering   off;
    proxy_pass        http://ezzy_app_server;
}

# Catch-all WAHA reverse proxy — injects the API key server-side so the
# browser never holds it. Anything under /waha/ that didn't match above
# (e.g. /waha/api/sessions/default, /waha/api/files/..., /waha/) lands here.
location /waha/ {
    # Optional: gate the raw WAHA Swagger and JSON endpoints behind the
    # same htpasswd as the ops UIs. Leave commented to keep the chat UI's
    # in-page fetch calls (/waha/api/...) frictionless once the user is
    # already authed by the ops UI itself.
    # auth_basic            "EzzyDelivery ops";
    # auth_basic_user_file  /etc/nginx/.htpasswd;

    proxy_set_header  X-Api-Key         "<WAHA_API_KEY>";
    proxy_set_header  Host              $host;
    proxy_redirect    off;
    proxy_buffering   off;            # for the QR image's repeated refreshes
    proxy_read_timeout 60s;
    proxy_pass        http://127.0.0.1:3000/;
}
