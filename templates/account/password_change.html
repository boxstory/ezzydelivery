{% extends "account/base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block account_content %}
<div class="row mt-5 justify-content-center">
    <div class="col-10 col-md-12" id="account_password_change_section_main">
        <h1 id="account_password_change_title_main">{% trans "Change Password" %}</h1>

        <form id="account_password_change_form_main" method="POST" action="{% url 'account_change_password' %}" class="password_change">
            {% csrf_token %}
            {{ form | crispy }}
            <button id="account_password_change_btn_submit" type="submit" name="action">{% trans "Change Password" %}</button>
            <a id="account_password_change_link_forgot" href="{% url 'account_reset_password' %}">{% trans "Forgot Password?" %}</a>
        </form>
    </div>
</div>
{% endblock %}
