{% extends "account/base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block account_content %}
<h1 id="account_password_set_title_main">{% trans "Set Password" %}</h1>

<form
    id="account_password_set_form_main"
    method="POST"
    action="{% url 'account_set_password' %}"
    class="password_set"
>
    {% csrf_token %}
    {{ form | crispy }}
    <input
        id="account_password_set_btn_submit"
        type="submit"
        name="action"
        value="{% trans 'Set Password' %}"
    />
</form>
{% endblock %}
