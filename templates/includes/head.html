{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="fb:pages" content="113704197128320" />

<!-- SEO Meta Tags - Dynamic from views or defaults -->
{% if seo %}
    <!-- Primary Meta Tags -->
    <meta name="description" content="{{ seo.description }}">
    <meta name="author" content="{{ seo.author }}">
    <meta name="language" content="{{ seo.language }}">
    <meta name="geo.region" content="{{ seo.region }}">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ seo.og_title }}">
    <meta property="og:description" content="{{ seo.og_description }}">
    <meta property="og:url" content="{{ seo.og_url }}">
    <meta property="og:image" content="{{ seo.og_image }}">
    <meta property="og:type" content="{{ seo.og_type }}">
    <meta property="og:site_name" content="{{ seo.og_site_name }}">
    <meta property="og:locale" content="{{ seo.og_locale }}">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="{{ seo.twitter_card }}">
    <meta name="twitter:title" content="{{ seo.twitter_title }}">
    <meta name="twitter:description" content="{{ seo.twitter_description }}">
    <meta name="twitter:image" content="{{ seo.twitter_image }}">
    <meta name="twitter:site" content="{{ seo.twitter_site }}">

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Search Engine -->
    <meta name="robots" content="{{ seo.robots }}">
    <meta name="revisit-after" content="{{ seo.revisit_after }}">
    <meta name="distribution" content="{{ seo.distribution }}">
    <meta name="rating" content="{{ seo.rating }}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ seo.canonical_url }}">
{% else %}
    <!-- Fallback Default SEO - Used when views don't pass seo context -->
    <meta name="description" content="EzzyDelivery offers fast, reliable delivery services across Qatar. Same-day courier in Doha, Al Wakrah & Lusail. E-commerce fulfillment and COD available.">
    <meta property="og:title" content="EzzyDelivery Qatar | Fast Delivery & Courier Service">
    <meta property="og:description" content="Qatar's trusted delivery service for businesses. Same-day delivery, COD, real-time tracking across Doha.">
    <meta property="og:image" content="{% static 'webpages/img/ezzy-logo-sqr-round.png' %}">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
{% endif %}

<!-- Dublin Core Metadata -->
<meta name="DC.title" content="EzzyDelivery Qatar - Professional Delivery Services">
<meta name="DC.description" content="Fast, reliable delivery services for e-commerce in Qatar. Same-day courier in Doha, Al Wakrah & Lusail.">
<meta name="DC.creator" content="EzzyDelivery Qatar">
<meta name="DC.subject" content="delivery services, e-commerce, Qatar, logistics">
<meta name="DC.publisher" content="EzzyDelivery Qatar">
<meta name="DC.contributor" content="EzzyDelivery Qatar">
<meta name="DC.date" content="2025-01-06">
<meta name="DC.type" content="Service">
<meta name="DC.format" content="text/html">
<meta name="DC.identifier" content="https://ezzydelivery.qa">
<meta name="DC.language" content="en-QA">
<meta name="DC.coverage" content="Qatar, Doha, Al Wakrah, Lusail">
<meta name="DC.rights" content="© 2025 EzzyDelivery Qatar">
<!-- Allow search engines to index and follow links -->
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="7 days">
<!-- Suggested interval for search engine crawlers to revisit your site -->
<!-- Favicon -->
<link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16x16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
<meta name="theme-color" content="#ffde00" />
