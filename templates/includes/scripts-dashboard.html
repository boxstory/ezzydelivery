{% load static %}
<!-- Dashboard-specific JavaScript libraries -->
<!-- All defer to ensure jQuery and Bootstrap (loaded earlier with defer) are available -->

<!-- DataTables Core & Extensions -->
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js" defer></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js" defer></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js" defer></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js" defer></script>

<!-- DataTables Buttons (Export functionality) -->
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js" defer></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js" defer></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js" defer></script>

<!-- Toastify JS - Notifications -->
<script src="https://cdn.jsdelivr.net/npm/toastify-js" defer></script>

<!-- Flatpickr - Date Picker -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>

<!-- Dashboard Custom Scripts -->
<script src="{% static 'webpages/js/dashboard-notifications.js' %}" defer></script>
<script src="{% static 'webpages/js/dashboard-tables.js' %}?v=20260215a" defer></script>
<script src="{% static 'webpages/js/dashboard-charts.js' %}" defer></script>
<script src="{% static 'webpages/js/dashboard-utils.js' %}" defer></script>

<script>
  var DASHBOARD_CONFIG = {
    brandPrimary: '#f7c000',
    brandNavy: '#001f3f',
    brandGrey: '#6c757d',
    brandSuccess: '#10B981',
    brandDanger: '#EF4444',
    brandWarning: '#F59E0B',
    fontFamily: 'Inter, Poppins, sans-serif'
  };

  document.addEventListener('DOMContentLoaded', function() {
    initDataTables();
    initDatePickers();
    initTooltips();
    setupHTMXListeners();
  });

  function initDataTables() {
    if (typeof $.fn !== 'undefined' && $.fn.DataTable) {
      $('.data-table').each(function() {
        var $table = $(this);
        if ($.fn.DataTable.isDataTable($table)) return;
        var exportButtons = $table.data('export') !== false;

        var config = {
          responsive: true,
          pageLength: 25,
          lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
          dom: exportButtons ? 'Bfrtip' : 'frtip',
          buttons: exportButtons ? [
            {
              extend: 'excel',
              text: '<i class="fa-solid fa-file-excel"></i> Excel',
              className: 'btn btn-sm btn-success'
            },
            {
              extend: 'pdf',
              text: '<i class="fa-solid fa-file-pdf"></i> PDF',
              className: 'btn btn-sm btn-danger'
            },
            {
              extend: 'print',
              text: '<i class="fa-solid fa-print"></i> Print',
              className: 'btn btn-sm btn-secondary'
            }
          ] : [],
          language: {
            search: "_INPUT_",
            searchPlaceholder: "Search...",
            lengthMenu: "Show _MENU_ entries",
            info: "Showing _START_ to _END_ of _TOTAL_ entries",
            infoEmpty: "No entries found",
            infoFiltered: "(filtered from _MAX_ total entries)",
            zeroRecords: "No matching records found",
            emptyTable: "No data available"
          },
          columnDefs: [
            {
              targets: 'no-sort',
              orderable: false
            }
          ]
        };
        $table.DataTable(config);
      });
    }
  }

  function initDatePickers() {
    if (typeof flatpickr !== 'undefined') {
      flatpickr('.date-picker', {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'F j, Y',
        allowInput: true
      });

      flatpickr('.date-range-picker', {
        mode: 'range',
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'F j, Y',
        allowInput: true
      });

      flatpickr('.datetime-picker', {
        enableTime: true,
        dateFormat: 'Y-m-d H:i',
        altInput: true,
        altFormat: 'F j, Y at H:i',
        time_24hr: true
      });
    }
  }

  function initTooltips() {
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.forEach(function(tooltipTriggerEl) {
      if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      }
    });
  }

  function setupHTMXListeners() {
    document.body.addEventListener('htmx:beforeRequest', function(evt) {
      showLoadingSpinner();
    });

    document.body.addEventListener('htmx:afterSwap', function(evt) {
      hideLoadingSpinner();
      initDataTables();
      initDatePickers();
      initTooltips();
    });

    document.body.addEventListener('htmx:responseError', function(evt) {
      hideLoadingSpinner();
      if (typeof showToast === 'function') {
        showToast('An error occurred. Please try again.', 'error');
      }
    });
  }

  function showLoadingSpinner() {
    var spinner = document.getElementById('loading-spinner');
    if (spinner) spinner.classList.remove('d-none');
  }

  function hideLoadingSpinner() {
    var spinner = document.getElementById('loading-spinner');
    if (spinner) spinner.classList.add('d-none');
  }
</script>
