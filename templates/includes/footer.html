{% load static %}
<style>
  .footer {
    background: #f5f5f5;
    border-top: 1px solid #dee2e6;
    margin-top: auto;
  }

  .footer-content {
    padding: 1.25rem 0 0.75rem;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: center;
    justify-content: center;
    list-style: none;
    padding: 0;
    margin-bottom: 1rem;
  }

  .footer-links li {
    margin-bottom: 0;
  }

  .footer-links a {
    text-decoration: none;
    color: #212529;
    font-weight: 600;
    font-size: 0.875rem;
    transition: all 0.3s ease;
    position: relative;
    padding-bottom: 2px;
    display: inline-block;
  }

  .footer-links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--brand-primary, #ffd33b);
    transition: width 0.3s ease;
  }

  .footer-links a:hover::after {
    width: 100%;
  }

  .footer-links a:hover {
    color: #000;
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .social-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 50%;
    text-decoration: none;
    color: #212529;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .social-links a:hover {
    background: var(--brand-primary, #ffd33b);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(255, 211, 59, 0.4);
  }

  .footer-divider {
    border: none;
    border-top: 1px solid #dee2e6;
    margin: 1rem 0 0.75rem;
    opacity: 0.5;
  }

  .copyright-text {
    text-align: center;
    color: #6c757d;
    font-size: 0.8125rem;
    margin: 0;
    padding-bottom: 0.75rem;
  }

  @media (max-width: 768px) {
    .footer-content {
      padding: 1rem 0 0.5rem;
    }

    .footer-links {
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .footer-links a {
      font-size: 0.8125rem;
    }

    .social-links {
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .social-links a {
      width: 35px;
      height: 35px;
    }

    .social-links a i {
      font-size: 0.95rem;
    }

    .footer-divider {
      margin: 0.75rem 0 0.5rem;
    }

    .copyright-text {
      font-size: 0.75rem;
      padding-bottom: 0.5rem;
    }
  }
</style>

<footer id="sticky-footer" class="footer">
  <div class="container footer-content">
    <div class="text-center">
      <ul class="footer-links">
        <li>
          <a href="{% url 'core:join_business' %}">Delivery Partner</a>
        </li>
        <li>
          <a href="{% url 'core:join_driver' %}">Join as Fleet</a>
        </li>
        <li class="d-none d-md-block">
          <a href="/careers/">Careers</a>
        </li>
        <li class="d-none d-md-block">
          <a href="/about/">About</a>
        </li>
      </ul>

      <div class="social-links">
        <a href="https://www.facebook.com/ezzydelivery.qa/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://www.instagram.com/ezzydelivery.qa/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram">
          <i class="fa-brands fa-twitter"></i>
        </a>
        <a href="https://www.instagram.com/ezzydelivery.qa"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://www.linkedin.com/ezzydelivery.qa"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>

      <hr class="footer-divider">

      <p class="copyright-text">
        All rights reserved © Yellowkey Qatar <span id="current-year"></span>
      </p>
    </div>
  </div>
</footer>

<script>
  // Auto-update copyright year
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>
