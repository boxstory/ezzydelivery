<script>
  // Configure HTMX before it initializes
  document.addEventListener('DOMContentLoaded', function() {
    // Reduce history cache size to prevent localStorage quota errors
    htmx.config.historyCacheSize = 5; // Default is 10, reduce to 5
    htmx.config.refreshOnHistoryMiss = true; // Refresh page if cache miss
  });

  document.body.addEventListener("htmx:configRequest", (event) => {
    event.detail.headers["X-CSRFToken"] = "{{ csrf_token }}"; //insert csrf token when performing AJAX request
  });

  // Handle HTMX history cache errors gracefully
  document.body.addEventListener("htmx:historyCacheError", function(evt) {
    console.warn("HTMX history cache error - clearing cache:", evt.detail);

    // Clear the HTMX history cache to prevent quota errors
    try {
      localStorage.removeItem('htmx-history-cache');
      console.log("HTMX history cache cleared successfully");
    } catch (e) {
      console.error("Failed to clear HTMX cache:", e);
    }

    // Prevent the error from breaking the app
    evt.preventDefault();

    // Optionally reload the page to ensure clean state
    // window.location.reload();
  });

  // Monitor localStorage usage and clear if needed
  document.body.addEventListener("htmx:beforeHistorySave", function(evt) {
    try {
      // Check if we're getting close to quota
      const historyCache = localStorage.getItem('htmx-history-cache');
      if (historyCache && historyCache.length > 500000) { // ~500KB
        console.warn("HTMX history cache getting large, clearing...");
        localStorage.removeItem('htmx-history-cache');
      }
    } catch (e) {
      // If any error, clear the cache
      localStorage.removeItem('htmx-history-cache');
    }
  });

  // Reinitialize Select2 after HTMX loads new content
  document.body.addEventListener("htmx:afterSwap", function(evt) {
    // Check if jQuery and Select2 are available
    if (typeof jQuery !== 'undefined' && typeof jQuery.fn.select2 !== 'undefined') {
      // Find all select elements that should use Select2
      const selectElements = evt.detail.target.querySelectorAll('select[id^="id_pickup_location"], select[id^="id_product"], select.select2-enable');

      selectElements.forEach(function(selectEl) {
        // Destroy existing Select2 instance if it exists
        if (jQuery(selectEl).data('select2')) {
          jQuery(selectEl).select2('destroy');
        }
        // Initialize Select2
        jQuery(selectEl).select2();
      });
    }
  });
</script>

<script>
  const dropdowns = document.querySelectorAll(".status-dropdown");
  dropdowns.forEach((dropdown) => {
    dropdown.addEventListener("change", () => {
      const selectedOption = dropdown.options[dropdown.selectedIndex].value;
      const selectedRow = dropdown.closest("tr");
      const order_id = selectedRow.dataset.orderId;

      // get with the csrf
      const csrftoken = getCookie("csrftoken");

      // Show loading state on dropdown
      dropdown.disabled = true;
      const originalValue = dropdown.value;

      // Send a POST request to the server using AJAX
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/orders/update_order_status/", true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
      xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
      xhr.setRequestHeader("X-CSRFToken", csrftoken);

      // Set timeout for the request
      xhr.timeout = 10000; // 10 seconds

      xhr.onload = () => {
        dropdown.disabled = false;
        if (xhr.status === 200) {
          try {
            const response = JSON.parse(xhr.responseText);
            if (response.status === "success") {
              // Visual feedback for success
              selectedRow.classList.add('status-updated');
              setTimeout(() => selectedRow.classList.remove('status-updated'), 1500);
            } else {
              // Revert on error and show user feedback
              dropdown.value = originalValue;
              showStatusMessage(selectedRow, 'Error: ' + (response.error || 'Update failed'), 'error');
            }
          } catch (e) {
            dropdown.value = originalValue;
            showStatusMessage(selectedRow, 'Error processing response', 'error');
          }
        } else {
          // Revert on HTTP error
          dropdown.value = originalValue;
          showStatusMessage(selectedRow, 'Server error. Please try again.', 'error');
        }
      };

      xhr.onerror = () => {
        dropdown.disabled = false;
        dropdown.value = originalValue;
        showStatusMessage(selectedRow, 'Network error. Please check your connection.', 'error');
      };

      xhr.ontimeout = () => {
        dropdown.disabled = false;
        dropdown.value = originalValue;
        showStatusMessage(selectedRow, 'Request timed out. Please try again.', 'error');
      };

      // Send the request with the selected option and object ID
      const data = `status=${selectedOption}&order_id=${order_id}`;
      xhr.send(data);
    });
  });

  // Show temporary status message near the row
  function showStatusMessage(row, message, type) {
    // Remove any existing message
    const existingMsg = row.querySelector('.status-message');
    if (existingMsg) existingMsg.remove();

    const msgEl = document.createElement('span');
    msgEl.className = 'status-message';
    msgEl.textContent = message;
    msgEl.style.cssText = type === 'error'
      ? 'color: #dc3545; font-size: 0.85rem; margin-left: 0.5rem;'
      : 'color: #28a745; font-size: 0.85rem; margin-left: 0.5rem;';

    const dropdown = row.querySelector('.status-dropdown');
    if (dropdown && dropdown.parentNode) {
      dropdown.parentNode.appendChild(msgEl);
      setTimeout(() => msgEl.remove(), 5000);
    }
  }

  // Helper function to get the CSRF token value from the cookie
  function getCookie(name) {
    const cookieValue = document.cookie.match(
      "(^|;)\\s*" + name + "\\s*=\\s*([^;]+)"
    );
    return cookieValue ? cookieValue.pop() : "";
  }
</script>

<script>
  $(document).ready(function () {
    // First, close ALL submenus and reset their states
    $(".dashboard-sidebar .multi-level, .dashboard-sidebar .submenu").removeClass("show");
    $(".dashboard-sidebar [data-bs-toggle='collapse']").attr("aria-expanded", "false");
    $(".dashboard-sidebar [data-bs-toggle='collapse'] .fa-caret-down").css("transform", "rotate(0deg)");

    // Now open ONLY the submenu that contains an active sublink
    // Check if any submenu contains an active nav-link (sublink)
    $(".dashboard-sidebar .multi-level, .dashboard-sidebar .submenu").each(function() {
      const submenu = $(this);
      const hasActiveSublink = submenu.find(".nav-link.active, .nav-item.active").length > 0;

      if (hasActiveSublink) {
        // Open this submenu
        submenu.addClass("show");

        // Update the parent toggle
        const toggleBtn = $('[data-bs-target="#' + submenu.attr('id') + '"]');
        if (toggleBtn.length) {
          toggleBtn.attr("aria-expanded", "true");
          toggleBtn.find(".fa-caret-down").css("transform", "rotate(180deg)");
        }
      }
    });
  });
</script>

<script>
  // Sidebar accordion behavior - close other dropdowns when one is opened
  document.addEventListener('DOMContentLoaded', function() {
    // Target ALL sidebar containers (desktop and mobile)
    const sidebarContainers = document.querySelectorAll('.dashboard-sidebar');
    if (!sidebarContainers.length) return;

    sidebarContainers.forEach(function(sidebarContainer) {
      // Get all collapse toggle elements in this sidebar
      const collapseToggles = sidebarContainer.querySelectorAll('[data-bs-toggle="collapse"]');

      collapseToggles.forEach(function(toggle) {
        toggle.addEventListener('click', function(e) {
          const targetId = this.getAttribute('data-bs-target');
          const targetElement = document.querySelector(targetId);

          // If this dropdown is currently closed, close all other open dropdowns
          if (targetElement && !targetElement.classList.contains('show')) {
            // Find all open dropdowns in THIS sidebar only
            const openDropdowns = sidebarContainer.querySelectorAll('.multi-level.show');

            openDropdowns.forEach(function(openDropdown) {
              // Don't close the one we're about to open
              if (openDropdown.id !== targetId.replace('#', '')) {
                // Use Bootstrap's collapse API to close
                const bsCollapse = bootstrap.Collapse.getInstance(openDropdown);
                if (bsCollapse) {
                  bsCollapse.hide();
                } else {
                  // Fallback: manually remove show class and update aria
                  openDropdown.classList.remove('show');
                  const parentToggle = sidebarContainer.querySelector('[data-bs-target="#' + openDropdown.id + '"]');
                  if (parentToggle) {
                    parentToggle.setAttribute('aria-expanded', 'false');
                    parentToggle.classList.remove('active');
                  }
                }
              }
            });
          }
        });
      });

      // Also handle the collapse events to update toggle states
      const allCollapses = sidebarContainer.querySelectorAll('.multi-level');
      allCollapses.forEach(function(collapseEl) {
        collapseEl.addEventListener('show.bs.collapse', function() {
          const toggleBtn = sidebarContainer.querySelector('[data-bs-target="#' + this.id + '"]');
          if (toggleBtn) {
            toggleBtn.classList.add('active');
            // Rotate caret icon
            const caret = toggleBtn.querySelector('.fa-caret-down');
            if (caret) {
              caret.style.transform = 'rotate(180deg)';
              caret.style.transition = 'transform 0.3s ease';
            }
          }
        });

        collapseEl.addEventListener('hide.bs.collapse', function() {
          const toggleBtn = sidebarContainer.querySelector('[data-bs-target="#' + this.id + '"]');
          if (toggleBtn) {
            toggleBtn.classList.remove('active');
            // Reset caret icon
            const caret = toggleBtn.querySelector('.fa-caret-down');
            if (caret) {
              caret.style.transform = 'rotate(0deg)';
            }
          }
        });
      });
    });
  });
</script>

<script>
  // Fix dropdown states after HTMX navigation - handles both business and workforce dashboards
  document.body.addEventListener('htmx:afterSettle', function(evt) {
    // Small delay to ensure DOM is fully updated after redirect
    setTimeout(function() {
      // Get current path - this is the FINAL destination URL
      const currentPath = window.location.pathname;

      // STEP 1: Aggressively remove ALL active states from everything
      // Handle both business (.multi-level) and workforce (.submenu, .collapse) dropdowns
      const allDropdowns = document.querySelectorAll('.dashboard-sidebar .multi-level, .dashboard-sidebar .submenu, .dashboard-sidebar .collapse');
      allDropdowns.forEach(function(dropdown) {
        dropdown.classList.remove('show');
      });

      const allToggles = document.querySelectorAll('.dashboard-sidebar [data-bs-toggle="collapse"]');
      allToggles.forEach(function(toggle) {
        toggle.setAttribute('aria-expanded', 'false');
        toggle.classList.remove('active');
        const caret = toggle.querySelector('.fa-caret-down, .fa-chevron-down');
        if (caret) {
          caret.style.transform = 'rotate(0deg)';
        }
      });

      const allNavItems = document.querySelectorAll('.dashboard-sidebar .nav-item');
      allNavItems.forEach(function(item) {
        item.classList.remove('active');
      });

      const allNavLinks = document.querySelectorAll('.dashboard-sidebar .nav-link, .dashboard-sidebar .submenu-link');
      allNavLinks.forEach(function(link) {
        link.classList.remove('active');
      });

      // STEP 2: Determine which dropdown should be open based on URL
      // Priority order: check most specific patterns first
      let targetDropdownId = null;

      // ========== WORKFORCE DASHBOARD DROPDOWNS ==========
      // Warehouse URLs
      if (currentPath.includes('/warehouse/')) {
        targetDropdownId = 'submenu-warehouse';
      }
      // Workforce-specific orders URLs
      else if (currentPath.includes('/workforce/') && currentPath.includes('orders')) {
        targetDropdownId = 'submenu-orders';
      }
      // Tasks/Deliveries URLs
      else if (currentPath.includes('/workforce/') && (currentPath.includes('task') || currentPath.includes('delivery') || currentPath.includes('dl_'))) {
        targetDropdownId = 'submenu-deliveries';
      }
      // DMS URLs
      else if (currentPath.includes('/workforce/') && currentPath.includes('dms')) {
        targetDropdownId = 'submenu-dms';
      }
      // Fleet URLs
      else if (currentPath.includes('/workforce/') && currentPath.includes('fleet')) {
        targetDropdownId = 'submenu-accounts';
      }
      // Document URLs
      else if (currentPath.includes('/workforce/') && (currentPath.includes('document') || currentPath.includes('license') || currentPath.includes('vehicle'))) {
        targetDropdownId = 'submenu-documents';
      }
      // Inventory URLs (workforce)
      else if (currentPath.includes('/workforce/') && currentPath.includes('inventory')) {
        targetDropdownId = 'submenu-inventory';
      }
      // Fulfillment URLs
      else if (currentPath.includes('/workforce/') && (currentPath.includes('supplier') || currentPath.includes('fulfilled'))) {
        targetDropdownId = 'submenu-fulfillment';
      }
      // Sellers URLs
      else if (currentPath.includes('/workforce/') && currentPath.includes('seller')) {
        targetDropdownId = 'submenu-sellers';
      }
      // ========== BUSINESS DASHBOARD DROPDOWNS ==========
      // Settings-related URLs (most specific)
      else if (currentPath.includes('/settings/') ||
          currentPath.includes('/teams/') ||
          currentPath.includes('/pickup-location/')) {
        targetDropdownId = 'submenu-settings';
      }
      // Product URLs
      else if (currentPath.includes('/product/')) {
        targetDropdownId = 'submenu-product';
      }
      // Orders URLs - ONLY if not already handled
      else if (currentPath.includes('/orders/')) {
        targetDropdownId = 'submenu-orders';
      }

      // STEP 3: Open ONLY the correct dropdown
      if (targetDropdownId) {
        const targetDropdown = document.getElementById(targetDropdownId);
        if (targetDropdown) {
          targetDropdown.classList.add('show');

          const toggle = document.querySelector('[data-bs-target="#' + targetDropdownId + '"]');
          if (toggle) {
            toggle.setAttribute('aria-expanded', 'true');
            toggle.classList.add('active');

            const parentNavItem = toggle.closest('.nav-item');
            if (parentNavItem) {
              parentNavItem.classList.add('active');
            }

            const caret = toggle.querySelector('.fa-caret-down, .fa-chevron-down');
            if (caret) {
              caret.style.transform = 'rotate(180deg)';
            }
          }

          // STEP 4: Highlight the specific active link within the dropdown
          const linksInDropdown = targetDropdown.querySelectorAll('.nav-link, .submenu-link');
          linksInDropdown.forEach(function(link) {
            const href = link.getAttribute('href');
            // Check if the link's href matches the current path (exact or starts with)
            if (href) {
              const hrefPath = href.split('?')[0];
              if (currentPath === hrefPath || currentPath.startsWith(hrefPath + '/')) {
                link.classList.add('active');
                const linkParentItem = link.closest('.nav-item');
                if (linkParentItem) {
                  linkParentItem.classList.add('active');
                }
              }
            }
          });
        }
      }

      // STEP 5: If no dropdown matched, try to find and highlight single nav links
      if (!targetDropdownId) {
        const allSingleLinks = document.querySelectorAll('.dashboard-sidebar .nav-link-single, .dashboard-sidebar a.nav-link:not(.nav-link-collapse)');
        allSingleLinks.forEach(function(link) {
          const href = link.getAttribute('href');
          if (href) {
            const hrefPath = href.split('?')[0];
            if (currentPath === hrefPath) {
              link.classList.add('active');
              const parentNavItem = link.closest('.nav-item');
              if (parentNavItem) {
                parentNavItem.classList.add('active');
              }
            }
          }
        });
      }
    }, 100); // Increased to 100ms for better reliability with redirects
  });
</script>

<script>
  // Mobile sidebar toggle icon rotation
  document.addEventListener('DOMContentLoaded', function() {
    const sidebarToggleBtn = document.querySelector('[data-bs-target="#navbarNav2"]');
    const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');
    const sidebarCollapse = document.getElementById('navbarNav2');

    if (sidebarCollapse && sidebarToggleIcon) {
      sidebarCollapse.addEventListener('show.bs.collapse', function() {
        sidebarToggleIcon.classList.remove('fa-chevron-down');
        sidebarToggleIcon.classList.add('fa-chevron-up');
      });

      sidebarCollapse.addEventListener('hide.bs.collapse', function() {
        sidebarToggleIcon.classList.remove('fa-chevron-up');
        sidebarToggleIcon.classList.add('fa-chevron-down');
      });
    }
  });
</script>
