<!-- Toast Test Buttons - Include this temporarily to test toasts -->
<div class="position-fixed bottom-0 start-0 p-3" style="z-index: 9998;">
  <div class="card shadow">
    <div class="card-header bg-dark text-white py-2">
      <small class="fw-bold">🧪 Toast Test Panel</small>
      <button type="button" class="btn-close btn-close-white float-end" onclick="this.closest('.card').remove()" aria-label="Close"></button>
    </div>
    <div class="card-body p-2">
      <div class="btn-group-vertical w-100" role="group">
        <button type="button" class="btn btn-sm btn-success mb-1" onclick="showSuccessToast('Operation completed successfully!')">
          <i class="fas fa-check-circle"></i> Success
        </button>
        <button type="button" class="btn btn-sm btn-danger mb-1" onclick="showErrorToast('An error occurred!')">
          <i class="fas fa-exclamation-circle"></i> Error
        </button>
        <button type="button" class="btn btn-sm btn-warning mb-1" onclick="showWarningToast('Please be careful!')">
          <i class="fas fa-exclamation-triangle"></i> Warning
        </button>
        <button type="button" class="btn btn-sm btn-info mb-1" onclick="showInfoToast('Here is some information')">
          <i class="fas fa-info-circle"></i> Info
        </button>
        <button type="button" class="btn btn-sm btn-primary mb-1" onclick="showToast({message: 'Custom notification', type: 'primary'})">
          <i class="fas fa-bell"></i> Primary
        </button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="showToast({message: 'This toast will not auto-hide', type: 'info', autohide: false})">
          <i class="fas fa-lock"></i> Persistent
        </button>
      </div>
    </div>
    <div class="card-footer text-center py-1">
      <small class="text-muted">Remove this in production</small>
    </div>
  </div>
</div>
