{% load static %}
<!-- Dashboard-specific head includes -->
<!-- Extends base head.html with dashboard-only libraries -->

<!-- ApexCharts - Modern Charts & Analytics -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>

<!-- DataTables - Advanced Table Features -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

<!-- Toastify - Modern Toast Notifications -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<!-- Flatpickr - Modern Date Picker -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<!-- Animate.css - Smooth Animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<!-- Dashboard Custom CSS -->
<link rel="stylesheet" href="{% static 'webpages/css/dashboard-modern.css' %}">

<style>
  /* Dashboard-specific overrides */

  /* ApexCharts customization for Ezzy Yellow theme */
  .apexcharts-theme-light {
    --apexcharts-theme-color: var(--brand-primary);
  }

  /* DataTables customization */
  .dataTables_wrapper .dataTables_filter input {
    border: 1px solid var(--brand-grey-300);
    border-radius: var(--brand-radius-sm);
    padding: 0.375rem 0.75rem;
  }

  .dataTables_wrapper .dataTables_paginate .paginate_button.current {
    background: var(--brand-primary) !important;
    border-color: var(--brand-primary) !important;
    color: var(--brand-black) !important;
  }

  /* Toast notification styling */
  .toastify {
    font-family: var(--brand-font-primary);
    border-radius: var(--brand-radius-md);
    box-shadow: var(--brand-shadow-lg);
  }

  /* Flatpickr theme */
  .flatpickr-calendar {
    border-radius: var(--brand-radius-md);
    box-shadow: var(--brand-shadow-lg);
  }

  .flatpickr-day.selected {
    background: var(--brand-primary);
    border-color: var(--brand-primary);
    color: var(--brand-black);
  }

  /* Card animations */
  .stat-card {
    animation: fadeInUp 0.5s ease-out;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Mobile-responsive charts */
  @media (max-width: 768px) {
    .apexcharts-canvas {
      max-width: 100%;
    }

    .chart-container {
      margin-bottom: var(--spacing-lg);
    }
  }
</style>
