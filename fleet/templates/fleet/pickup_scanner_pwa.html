{% extends "fleet/pwa_base.html" %}
{% load static %}

{% block title %}Scan Pickup{% endblock %}
{% block page_title %}Scan Pickup{% endblock %}

{% block bottom_nav %}
<!-- Hide bottom nav on scanner -->
{% endblock %}

{% block content %}
<!-- Scanner Container -->
<div class="fleet-scanner-container">
    <!-- Camera Video -->
    <video id="cameraVideo" autoplay playsinline></video>

    <!-- Scanner Overlay -->
    <div class="fleet-scanner">
        <div class="fleet-scanner__viewport">
            <div class="fleet-scanner__frame"></div>
            <div class="fleet-scanner__line"></div>
        </div>

        <div class="fleet-scanner__hint">
            <i class="fa-solid fa-qrcode me-2"></i>
            Align barcode within frame
        </div>

        <button type="button" class="fleet-scanner__close" onclick="closeScanner()">
            <i class="fa-solid fa-times"></i>
        </button>

        <!-- Torch Toggle (if available) -->
        <button type="button" class="fleet-scanner__torch" id="torchBtn" style="display: none;" onclick="toggleTorch()">
            <i class="fa-solid fa-flashlight"></i>
        </button>
    </div>

    <!-- Manual Entry -->
    <div class="fleet-scanner__manual">
        <button type="button" class="fleet-btn fleet-btn--outline" onclick="showManualEntry()">
            <i class="fa-solid fa-keyboard me-2"></i>
            Enter Manually
        </button>
    </div>

    <!-- Scan result: stays inside the scanner window, camera still running, so
         the driver picks the next step and carries on scanning. -->
    <div class="fleet-scan-result" id="fleet_scan_result_panel" hidden>
        <div class="fleet-scan-result__head">
            <div class="fleet-scan-result__title" id="fleet_scan_result_title">—</div>
            <div class="fleet-scan-result__sub" id="fleet_scan_result_sub"></div>
        </div>

        <div class="fleet-scan-result__details" id="fleet_scan_result_details"></div>

        <div class="fleet-scan-result__warning" id="fleet_scan_result_warning" hidden></div>

        <div class="fleet-scan-result__actions" id="fleet_scan_result_actions"></div>

        <button type="button" class="fleet-btn fleet-btn--outline fleet-btn--block fleet-scan-result__next"
                onclick="resetScanner()">
            <i class="fa-solid fa-qrcode me-2"></i>Scan next
        </button>
    </div>
</div>

<!-- Manual Entry Modal -->
<div class="fleet-modal" id="manualEntryModal" style="display: none;">
    <div class="fleet-modal__overlay" onclick="hideManualEntry()"></div>
    <div class="fleet-modal__content">
        <div class="fleet-modal__header">
            <h3 class="fleet-modal__title">Enter Barcode</h3>
            <button type="button" class="fleet-btn-icon" onclick="hideManualEntry()">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <div class="fleet-modal__body">
            <form id="manualEntryForm" onsubmit="return submitManualEntry(event)">
                <div class="fleet-form-group">
                    <label for="barcodeInput" class="fleet-label">Barcode Number</label>
                    <input
                        type="text"
                        id="barcodeInput"
                        class="fleet-input"
                        placeholder="Enter barcode number"
                        autocomplete="off"
                        required
                    >
                </div>
                <button type="submit" class="fleet-btn fleet-btn--primary fleet-btn--block">
                    <i class="fa-solid fa-check me-2"></i>
                    Submit
                </button>
            </form>
        </div>
    </div>
</div>



<script>
    let videoStream = null;
    let torchEnabled = false;
    let isScanning = false;
    let _detector = null;
    let _detectTimer = null;

    /* ~8 looks a second. Fast enough to catch a label the moment it is framed,
       and far cheaper on a driver's battery than decoding every frame. */
    const DETECT_INTERVAL_MS = 120;

    const hintEl = document.querySelector('.fleet-scanner__hint');

    function setHint(text, icon) {
        if (!hintEl) return;
        hintEl.innerHTML = '<i class="fa-solid ' + (icon || 'fa-qrcode') + ' me-2"></i>' + text;
    }

    function cameraErrorText(err) {
        const name = (err && err.name) || '';
        if (name === 'NotAllowedError' || name === 'SecurityError') {
            return 'Camera permission is blocked. Allow Camera for ezzydelivery.qa in your browser settings, then reload.';
        }
        if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'No camera found on this device.';
        if (name === 'NotReadableError') return 'Camera is busy — close other apps using it and try again.';
        return name ? ('Camera error: ' + name) : 'Camera could not be started.';
    }

    /* Stay on the page when the camera cannot run — manual entry is right there
       and is the only way left to finish the job. */
    function scannerUnavailable(message) {
        stopBarcodeDetection();
        setHint(message, 'fa-triangle-exclamation');
        showToast(message, 'danger', 6000);
    }

    // Initialize camera
    async function initCamera() {
        const video = document.getElementById('cameraVideo');

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            scannerUnavailable('This browser does not allow camera access on this page.');
            return;
        }

        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
        } catch (error) {
            try {
                // Some devices reject the back-camera/resolution hints — take any camera
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
            } catch (error2) {
                console.error('Camera error:', error2);
                scannerUnavailable(cameraErrorText(error2));
                return;
            }
        }

        video.srcObject = videoStream;
        try { await video.play(); } catch (e) { /* autoplay attr covers it */ }

        // Check if torch is available
        const track = videoStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : null;
        if (capabilities && capabilities.torch) {
            document.getElementById('torchBtn').style.display = 'block';
        }

        startBarcodeDetection();
    }

    // jsQR fallback for browsers without BarcodeDetector (iOS Safari, Firefox).
    // QR only — it cannot read the Code128 bars on our waybills.
    let _jsqrLoad = null;
    function loadJsQr() {
        if (window.jsQR) return Promise.resolve(true);
        if (_jsqrLoad) return _jsqrLoad;
        _jsqrLoad = new Promise(resolve => {
            const s = document.createElement('script');
            s.src = "{% static 'fleet/js/jsqr.min.js' %}?v=20260727a";
            s.onload = () => resolve(!!window.jsQR);
            s.onerror = () => resolve(false);
            document.head.appendChild(s);
        });
        return _jsqrLoad;
    }

    /* Started fresh on every scan cycle. The old version hung its only start on
       the video's 'loadeddata' event, which never fires a second time — so
       scanning died after the first successful scan until the page reloaded. */
    async function startBarcodeDetection() {
        stopBarcodeDetection();
        isScanning = true;
        const video = document.getElementById('cameraVideo');

        if ('BarcodeDetector' in window) {
            try {
                if (!_detector) {
                    const wanted = ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code'];
                    let formats = wanted;
                    if (BarcodeDetector.getSupportedFormats) {
                        const supported = await BarcodeDetector.getSupportedFormats();
                        formats = wanted.filter(f => supported.includes(f));
                    }
                    if (formats.length) _detector = new BarcodeDetector({ formats: formats });
                }
            } catch (e) {
                console.warn('BarcodeDetector unavailable:', e);
                _detector = null;
            }
        }

        if (_detector) {
            setHint('Align barcode within frame');
            detectLoopNative(video);
            return;
        }

        const hasJsQr = await loadJsQr();
        if (hasJsQr) {
            setHint('QR only on this browser — tap Enter Manually for barcodes');
            detectLoopJsQr(video);
        } else {
            scannerUnavailable('This browser cannot scan — tap Enter Manually.');
        }
    }

    function stopBarcodeDetection() {
        isScanning = false;
        if (_detectTimer) { clearTimeout(_detectTimer); _detectTimer = null; }
    }

    function detectLoopNative(video) {
        const tick = async () => {
            if (!isScanning) return;
            if (video.readyState >= 2 && video.videoWidth) {
                try {
                    const found = await _detector.detect(video);
                    if (found.length > 0) {
                        handleBarcodeDetected(found[0].rawValue);
                        return;
                    }
                } catch (e) { /* keep trying */ }
            }
            _detectTimer = setTimeout(tick, DETECT_INTERVAL_MS);
        };
        tick();
    }

    function detectLoopJsQr(video) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const tick = () => {
            if (!isScanning) return;
            if (video.readyState >= 2 && video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                try {
                    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
                    if (code && code.data) {
                        handleBarcodeDetected(code.data);
                        return;
                    }
                } catch (e) { /* keep trying */ }
            }
            _detectTimer = setTimeout(tick, DETECT_INTERVAL_MS);
        };
        tick();
    }

    // Handle detected barcode
    function handleBarcodeDetected(barcode) {
        stopBarcodeDetection();
        haptic([10, 100, 10]);

        console.log('Barcode detected:', barcode);

        // Submit to backend
        submitBarcode(barcode);
    }

    const panel = document.getElementById('fleet_scan_result_panel');
    const panelTitle = document.getElementById('fleet_scan_result_title');
    const panelSub = document.getElementById('fleet_scan_result_sub');
    const panelDetails = document.getElementById('fleet_scan_result_details');
    const panelWarning = document.getElementById('fleet_scan_result_warning');
    const panelActions = document.getElementById('fleet_scan_result_actions');

    /* A label can mean more than one thing — a pickup the driver holds, a task
       of theirs waiting at the sender, or an unclaimed task in the pool. Ask the
       server what it is, then let the driver choose. Nothing is written until
       they tap an action. */
    async function submitBarcode(barcode) {
        showPanel({ title: barcode, subtitle: 'Looking up…', details: [], actions: [] });
        try {
            const response = await fetch('{% url "fleet:scan_resolve" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ code: barcode })
            });

            const data = await response.json();

            if (!data.success) {
                showPanel({ title: barcode, warning: data.error || 'Could not read this label' });
                return;
            }
            showPanel(data);
            haptic(data.found ? [10, 50, 10] : [40]);
        } catch (error) {
            console.error('Resolve error:', error);
            showPanel({ title: barcode, warning: 'Network error — check your signal and scan again.' });
        }
    }

    // Render the in-window result. Camera keeps running behind it.
    function showPanel(data) {
        panelTitle.textContent = data.title || data.code || '—';
        panelSub.textContent = data.subtitle || '';
        panelSub.hidden = !data.subtitle;

        panelDetails.innerHTML = '';
        (data.details || []).forEach(d => {
            const row = document.createElement('div');
            row.className = 'fleet-scan-result__row';
            const icon = document.createElement('i');
            icon.className = 'fa-solid ' + (d.icon || 'fa-circle-info');
            const text = document.createElement('span');
            text.textContent = d.text || '';
            row.appendChild(icon);
            row.appendChild(text);
            panelDetails.appendChild(row);
        });

        panelWarning.textContent = data.warning || '';
        panelWarning.hidden = !data.warning;

        panelActions.innerHTML = '';
        (data.actions || []).forEach(a => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'fleet-btn fleet-btn--primary fleet-btn--block';
            btn.innerHTML = '<i class="fa-solid ' + (a.icon || 'fa-check') + ' me-2"></i>' + a.label;
            btn.addEventListener('click', () => runAction(a, btn));
            panelActions.appendChild(btn);
        });

        panel.hidden = false;
    }

    // Commit the step the driver picked, then report back in the same window.
    async function runAction(action, btn) {
        const buttons = panelActions.querySelectorAll('button');
        buttons.forEach(b => { b.disabled = true; });
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Working…';

        try {
            const response = await fetch(action.endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(action.payload || {})
            });
            const data = await response.json();

            if (data.success) {
                haptic([10, 50, 10, 50, 10]);
                panelActions.innerHTML = '';
                panelWarning.hidden = true;
                panelSub.textContent = data.message || 'Done';
                panelSub.hidden = false;
                panel.classList.add('fleet-scan-result--done');
                if (data.next_step) {
                    const row = document.createElement('div');
                    row.className = 'fleet-scan-result__row';
                    row.innerHTML = '<i class="fa-solid fa-arrow-right"></i>';
                    const text = document.createElement('span');
                    text.textContent = data.next_step;
                    row.appendChild(text);
                    panelDetails.appendChild(row);
                }
            } else {
                panelWarning.textContent = data.error || 'That step could not be completed';
                panelWarning.hidden = false;
                buttons.forEach(b => { b.disabled = false; });
                btn.innerHTML = '<i class="fa-solid ' + (action.icon || 'fa-check') + ' me-2"></i>' + action.label;
            }
        } catch (error) {
            console.error('Action error:', error);
            panelWarning.textContent = 'Network error — nothing was changed. Try again.';
            panelWarning.hidden = false;
            buttons.forEach(b => { b.disabled = false; });
            btn.innerHTML = '<i class="fa-solid ' + (action.icon || 'fa-check') + ' me-2"></i>' + action.label;
        }
    }

    // Back to scanning — panel closes, camera was never stopped.
    function resetScanner() {
        panel.hidden = true;
        panel.classList.remove('fleet-scan-result--done');
        panelActions.innerHTML = '';
        startBarcodeDetection();
    }

    // Close scanner
    function closeScanner() {
        stopBarcodeDetection();
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        window.location.href = '{% url "fleet:fleet_dashboard" %}';
    }

    // Toggle torch
    async function toggleTorch() {
        if (!videoStream) return;

        const track = videoStream.getVideoTracks()[0];
        try {
            await track.applyConstraints({
                advanced: [{ torch: !torchEnabled }]
            });
            torchEnabled = !torchEnabled;
            document.getElementById('torchBtn').classList.toggle('active');
            haptic([10]);
        } catch (error) {
            console.error('Torch error:', error);
        }
    }

    // Manual entry
    function showManualEntry() {
        document.getElementById('manualEntryModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('barcodeInput').focus();
        }, 300);
    }

    function hideManualEntry() {
        document.getElementById('manualEntryModal').style.display = 'none';
    }

    function submitManualEntry(e) {
        e.preventDefault();
        const barcode = document.getElementById('barcodeInput').value.trim();
        if (barcode) {
            hideManualEntry();
            handleBarcodeDetected(barcode);
        }
        return false;
    }

    // Initialize on load
    window.addEventListener('load', () => {
        setTimeout(() => {
            initCamera();
        }, 300);
    });

    // Cleanup on unload
    window.addEventListener('beforeunload', () => {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
    });
</script>
{% endblock %}
