{% load static %}
<!-- PWA Mobile Header - Only visible on mobile (< 768px) -->
<header class="pwa-header d-md-none">
  <a href="{% url 'fleet:fleet_dashboard' %}" class="pwa-header__logo">
    <img src="{% static 'webpages/img/ezzy-logo-long-white.png' %}" alt="Ezzy Delivery" class="pwa-header__logo-img">
  </a>
  <div class="pwa-header__actions">
    <button class="pwa-header__btn" id="pwa-notifications-btn" title="Notifications">
      <i class="fa-solid fa-bell"></i>
    </button>
    <button class="pwa-header__btn" id="pwa-profile-btn" onclick="location.href='{% url 'fleet:driver_profile_mobile' %}'" title="Profile">
      <i class="fa-solid fa-user"></i>
    </button>
  </div>
</header>
