{% load static %}
<!-- PWA Mobile Bottom Navigation - Only visible on mobile (< 768px) -->
<nav class="pwa-bottom-nav d-md-none">
  <a href="{% url 'fleet:fleet_dashboard' %}"
     class="pwa-bottom-nav__item {% if request.resolver_match.url_name == 'fleet_dashboard' %}active{% endif %}">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>

  <a href="{% url 'delivery:all_delivery_tasks' %}"
     class="pwa-bottom-nav__item {% if request.resolver_match.url_name == 'all_delivery_tasks' %}active{% endif %}">
    <i class="fa-solid fa-list-check"></i>
    <span>Tasks</span>
    {% if pending_tasks_count %}
    <span class="pwa-bottom-nav__badge">{{ pending_tasks_count }}</span>
    {% endif %}
  </a>

  <a href="{% url 'fleet:cod_collection' %}"
     class="pwa-bottom-nav__item {% if request.resolver_match.url_name == 'cod_collection' %}active{% endif %}">
    <i class="fa-solid fa-money-bill-wave"></i>
    <span>COD</span>
  </a>

  <a href="{% url 'fleet:driver_earnings' %}"
     class="pwa-bottom-nav__item {% if request.resolver_match.url_name == 'driver_earnings' %}active{% endif %}">
    <i class="fa-solid fa-wallet"></i>
    <span>Earnings</span>
  </a>

  <a href="{% url 'fleet:driver_profile_mobile' %}"
     class="pwa-bottom-nav__item {% if request.resolver_match.url_name == 'driver_profile_mobile' %}active{% endif %}">
    <i class="fa-solid fa-user-circle"></i>
    <span>Profile</span>
  </a>
</nav>
